<!-- ===== Dashboard application ===== -->
<script>
"use strict";
(function(){

/* =========================================================================
 * DATA SERVICE — backend-swappable layer.
 *
 * Every method below currently returns deterministic, illustrative ("dummy")
 * data that reproduces the design prototype exactly. Each maps cleanly onto a
 * future real backend endpoint (see PRD §5/§6), so the UI never has to change:
 *
 *   regions()        -> GET /api/regions          (REGION)
 *   summary(rid,yr)  -> GET /api/summary           (YEARLY_SUMMARY)
 *   ratios(rid,yr)   -> GET /api/ratios            (RATIO_RESULT)
 *   recs(rid,yr)     -> GET /api/recommendations   (RECOMMENDATION)
 *   statement(...)   -> GET /api/laporan           (BUDGET_ENTRY)
 *
 * To wire a real backend later: replace the bodies of these methods with
 * fetch() calls (or hydrate a cache on load) and keep the same return shapes.
 * ========================================================================= */
const DataService = {
  // ---- REGION ----
  regions(){
    const R=(typeof window!=='undefined')&&window.APBD&&window.APBD.store;
    if(R&&R.regions) return R.regions;
    return [
      {id:'prov',name:'Provinsi NTB',short:'Prov. NTB',type:'province'},
      {id:'mataram',name:'Kota Mataram',short:'KOMAT',type:'city'},
      {id:'klu',name:'Kab. Lombok Utara',short:'KLU',type:'regency'},
      {id:'lobar',name:'Kab. Lombok Barat',short:'LOBAR',type:'regency'},
      {id:'loteng',name:'Kab. Lombok Tengah',short:'LOTENG',type:'regency'},
      {id:'lotim',name:'Kab. Lombok Timur',short:'LOTIM',type:'regency'},
      {id:'ksb',name:'Kab. Sumbawa Barat',short:'KSB',type:'regency'},
      {id:'sumbawa',name:'Kab. Sumbawa',short:'SUMBAWA',type:'regency'},
      {id:'dompu',name:'Kab. Dompu',short:'DOMPU',type:'regency'},
      {id:'bima',name:'Kab. Bima',short:'KABI',type:'regency'},
      {id:'kobi',name:'Kota Bima',short:'KOBI',type:'city'},
    ];
  },
  regionById(id){ return this.regions().find(r=>r.id===id) || this.regions()[0]; },

  // deterministic generator helpers (stand-in for stored audited figures)
  _base(){ return {prov:5800,mataram:1750,klu:1150,lobar:2050,loteng:2600,lotim:3100,ksb:1450,sumbawa:2200,dompu:1350,bima:2000,kobi:980}; },
  _hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0)/4294967295; },

  // ---- YEARLY_SUMMARY (revenue/expenditure/financing breakdown) ----
  summary(rid,year){
    const R=(typeof window!=='undefined')&&window.APBD&&window.APBD.store;
    if(R){ const s=R.summary(rid,year); if(s) return s; }
    const b=this._base()[rid]||1000;
    const g=Math.pow(1.062,year-2021);
    const plannedRev=Math.round(b*g*(0.96+this._hash(rid+year+'r')*0.09));
    const serapan=0.80+this._hash(rid+year+'s')*0.185;
    const realizedRev=Math.round(plannedRev*serapan);
    const padShare = rid==='prov'?0.56 : rid==='mataram'?0.31 : rid==='kobi'?0.17 : 0.09+this._hash(rid+'p')*0.13;
    const padPlanned=Math.round(plannedRev*padShare);
    const padEff=0.83+this._hash(rid+year+'e')*0.26;
    const padRealized=Math.round(padPlanned*padEff);
    const transfer=plannedRev-padPlanned;
    const transferReal=realizedRev-padRealized;
    const plannedExp=Math.round(plannedRev*(1.0+(this._hash(rid+year+'x')-0.5)*0.07));
    const expSer=0.79+this._hash(rid+year+'xs')*0.19;
    const realizedExp=Math.round(plannedExp*expSer);
    const financing=realizedExp-realizedRev;
    let pegawai=0.33+this._hash(rid+'pg')*0.11;
    let modal=0.13+this._hash(rid+year+'md')*0.13;
    let barang=0.21+this._hash(rid+'br')*0.07;
    let lain=Math.max(0.08,1-pegawai-modal-barang);
    const sum=pegawai+modal+barang+lain; pegawai/=sum;modal/=sum;barang/=sum;lain/=sum;
    return {plannedRev,realizedRev,serapan,padPlanned,padRealized,transfer,transferReal,plannedExp,realizedExp,expSer,financing,padEff,bd:{pegawai,barang,modal,lain}};
  },

  // ---- RATIO_RESULT (six headline performance ratios) ----
  ratios(rid,year){
    const R=(typeof window!=='undefined')&&window.APBD&&window.APBD.store;
    if(R){ const rr=R.ratios(rid,year); if(rr) return rr; }
    const f=this.summary(rid,year);
    return {
      ddf: f.padRealized/f.realizedRev*100,
      rkk: f.padRealized/f.transferReal*100,
      efektivitas: f.padRealized/f.padPlanned*100,
      efisiensi: f.realizedExp/f.realizedRev*100,
      bmodal: f.bd.modal*100,
      ketergantungan: f.transfer/f.plannedRev*100,
    };
  },
  ratioCfg(){ return {
    ddf:{dir:1,mid:25,good:40,label:'Derajat Desentralisasi Fiskal',desc:'PAD / Total Pendapatan'},
    rkk:{dir:1,mid:50,good:75,label:'Rasio Kemandirian',desc:'PAD / Dana Transfer'},
    efektivitas:{dir:1,mid:90,good:100,label:'Efektivitas PAD',desc:'Realisasi / Target PAD'},
    efisiensi:{dir:-1,mid:100,good:90,label:'Efisiensi Belanja',desc:'Belanja / Pendapatan'},
    bmodal:{dir:1,mid:15,good:25,label:'Belanja Modal / Total',desc:'Porsi belanja modal'},
    ketergantungan:{dir:-1,mid:70,good:50,label:'Ketergantungan',desc:'Transfer / Pendapatan'},
  };},

  // ---- RECOMMENDATION (AI audit-focus cards) ----
  recs(rid,year){
    const R=(typeof window!=='undefined')&&window.APBD&&window.APBD.store;
    if(R){ const arr=R.recs(rid,year); if(arr){ const nm=this.regionById(rid).name; return arr.map((o,i)=>({...o,id:rid+year+i,region:nm,rid})); } }
    const f=this.summary(rid,year), r=this.ratios(rid,year), name=this.regionById(rid).name, out=[];
    const p=(x)=>fmtPct(x);
    if(f.serapan<0.865) out.push({title:'Serapan belanja rendah pada akhir tahun',reason:'Serapan anggaran hanya '+p(f.serapan*100)+' hingga akhir tahun anggaran — indikasi keterlambatan kontrak atau proses pengadaan. Perlu ditelusuri pada belanja modal.',priority:'Tinggi',ref:'serapan',refLabel:'Lihat peta serapan'});
    if(f.expSer>0.975) out.push({title:'Lonjakan realisasi belanja triwulan IV',reason:'Realisasi belanja mencapai '+p(f.expSer*100)+' namun terkonsentrasi di akhir tahun. Periksa kualitas pertanggungjawaban dan kewajaran penyerapan.',priority:'Tinggi',ref:'detail',refLabel:'Buka detail daerah'});
    if(r.efektivitas<92) out.push({title:'Target PAD tidak tercapai',reason:'Efektivitas PAD '+p(r.efektivitas)+' di bawah ambang batas. Potensi over-estimasi target atau kebocoran penerimaan asli daerah.',priority:'Sedang',ref:'rasio',refLabel:'Lihat rasio kinerja'});
    if(r.ketergantungan>68) out.push({title:'Ketergantungan dana transfer tinggi',reason:p(r.ketergantungan)+' pendapatan berasal dari dana transfer pusat. Kemandirian fiskal lemah — telaah strategi optimalisasi PAD.',priority:'Sedang',ref:'rasio',refLabel:'Lihat rasio kinerja'});

  lapFactor(rid,year){ return (this._base()[rid]/2000) * Math.pow(1.062, year-2025); },
  // remote-aware statement access (DB statement_line) with offline fallback (scaled Bima)
  statement(rid,year,tab){
    const R=(typeof window!=='undefined')&&window.APBD&&window.APBD.store;
    if(R){ const st=R.statement(rid,year,tab); if(st) return st; }
    return this.rawBima()[tab];
  },
  lapFactorFor(rid,year){
    const R=(typeof window!=='undefined')&&window.APBD&&window.APBD.store;
    if(R&&R.statement(rid,year,'LRA')) return 1; // remote values already in miliar, no scaling
    return this.lapFactor(rid,year);
  },
  audited(rid,year){
    const R=(typeof window!=='undefined')&&window.APBD&&window.APBD.store;
    if(R&&R.hasYearRegion(rid,year)) return R.audited(rid,year);
    return rid==='bima';
  },
  // ---- SiLPA — realisasi 'SISA LEBIH/(KURANG) PEMBIAYAAN ANGGARAN-SiLPA/(SIKPA)' from LRA, in miliar ----
  silpa(rid,year){
    const st=this.statement(rid,year,'LRA');
    if(st&&st.rows){
      const row=st.rows.find(r=>/SISA\s+LEBIH.*PEMBIAYAAN\s+ANGGARAN/i.test(r.l));
      if(row&&typeof row.v[1]==='number') return row.v[1]*this.lapFactorFor(rid,year);
    }
    return 0;
  },
  // ---- Komposisi belanja by category — realisasi from LRA, in miliar (incl. Hibah, Bansos, Tidak Terduga) ----
  belanjaComp(rid,year){
    const st=this.statement(rid,year,'LRA'), f=this.lapFactorFor(rid,year);
    const pick=(re)=>{ if(!st||!st.rows) return 0; const row=st.rows.find(r=>re.test(r.l)); return row&&typeof row.v[1]==='number'?row.v[1]*f:0; };
    const items=[
      {label:'Belanja Pegawai',        value:pick(/^Belanja Pegawai$/i),  color:'#1B6744'},
      {label:'Barang & Jasa',          value:pick(/Barang dan Jasa/i),    color:'#289865'},
      {label:'Belanja Modal',          value:pick(/^Belanja Modal$/i),    color:'#D4AF37'},
      {label:'Belanja Hibah',          value:pick(/Belanja Hibah/i),      color:'#7A631A'},
      {label:'Belanja Bantuan Sosial', value:pick(/Bantuan Sosial/i),     color:'#5FA77E'},
      {label:'Belanja Tidak Terduga',  value:pick(/Tidak Terduga/i),      color:'#C9A94B'},
    ];
    const total=pick(/^BELANJA DAERAH/i) || items.reduce((s,x)=>s+x.value,0);
    const lain=Math.max(0, total - items.reduce((s,x)=>s+x.value,0));
    items.push({label:'Lainnya', value:lain, color:'#E9D69B'});
    return items;
  },
  // per-region drivers for statement-based ratios; income side reuses summary() (consistent with Rasio tab)
  lapDrivers(rid,year){
    if(rid==='bima' && year===2025) return {PAD:209.559,Transfer:1825.057,TotalPend:2060.940,PADtarget:220.092,
      TotalBelanja:2032.254,BelModal:163.127,BelPegawai:1059.734,
      Kas:68.604,AsetLancar:180.757,Persediaan:21.473,KwjJP:29.850,TotalAset:3031.484,TotalKwj:29.850,Ekuitas:3001.634,
      PendLO:1993.958,BebanLO:1950.529,PendLOprev:1836.549,EkuitasAwal:2956.075};
    const f=this.summary(rid,year), h=(k)=>this._hash(rid+year+k);
    const PAD=f.padRealized, PADtarget=f.padPlanned, Transfer=f.transferReal, TotalPend=f.realizedRev;
    const TotalBelanja=f.realizedExp, BelModal=f.realizedExp*f.bd.modal, BelPegawai=f.realizedExp*f.bd.pegawai;
    const TotalAset=TotalPend*(1.2+h('am')*0.75);
    const kwjRatio=0.006+h('kw')*0.05;
    const TotalKwj=TotalAset*kwjRatio, KwjJP=TotalKwj*(0.9+h('jp')*0.1), Ekuitas=TotalAset-TotalKwj;
    const AsetLancar=KwjJP*(1.7+h('cr')*7.5), Persediaan=AsetLancar*(0.06+h('ps')*0.16), Kas=KwjJP*(0.4+h('ks')*3.4);
    const PendLO=TotalPend*(0.93+h('plo')*0.07), BebanLO=PendLO*(0.92+h('opr')*0.13);
    const fprev=this.summary(rid,Math.max(2021,year-1)), PendLOprev=fprev.realizedRev*(0.93+this._hash(rid+(year-1)+'plo')*0.07);
    const EkuitasAwal=Ekuitas/(1.0+(h('eg')*0.055-0.005));
    return {PAD,PADtarget,Transfer,TotalPend,TotalBelanja,BelModal,BelPegawai,Kas,AsetLancar,Persediaan,KwjJP,TotalAset,TotalKwj,Ekuitas,PendLO,BebanLO,PendLOprev,EkuitasAwal};

    {key:'solv',cat:'Solvabilitas',name:'Rasio Solvabilitas',formula:'Total Aset ÷ Total Kewajiban',unit:'x',dir:1,cukup:1.5,baik:2,note:'Kemampuan aset menutup seluruh kewajiban.',calc:D=>D.TotalAset/D.TotalKwj},
    {key:'der',cat:'Solvabilitas',name:'Kewajiban thd Ekuitas',formula:'Total Kewajiban ÷ Ekuitas',unit:'%',dir:-1,cukup:100,baik:50,note:'Tingkat leverage terhadap ekuitas.',calc:D=>D.TotalKwj/D.Ekuitas*100},

    {key:'ddf',cat:'Kemandirian Fiskal',name:'Derajat Desentralisasi Fiskal',formula:'PAD ÷ Total Pendapatan',unit:'%',dir:1,cukup:25,baik:40,note:'Kontribusi PAD terhadap pendapatan.',calc:D=>D.PAD/D.TotalPend*100},
    {key:'mandiri',cat:'Kemandirian Fiskal',name:'Rasio Kemandirian',formula:'PAD ÷ Pendapatan Transfer',unit:'%',dir:1,cukup:50,baik:75,note:'Kemandirian terhadap dana transfer.',calc:D=>D.PAD/D.Transfer*100},
    {key:'tergantung',cat:'Kemandirian Fiskal',name:'Rasio Ketergantungan',formula:'Transfer ÷ Total Pendapatan',unit:'%',dir:-1,cukup:70,baik:50,note:'Ketergantungan pada dana transfer.',calc:D=>D.Transfer/D.TotalPend*100},
    {key:'efekpad',cat:'Efisiensi & Belanja',name:'Efektivitas PAD',formula:'Realisasi ÷ Target PAD',unit:'%',dir:1,cukup:90,baik:100,note:'Capaian realisasi terhadap target PAD.',calc:D=>D.PAD/D.PADtarget*100},
    {key:'efisiensi',cat:'Efisiensi & Belanja',name:'Efisiensi Belanja',formula:'Belanja ÷ Pendapatan',unit:'%',dir:-1,cukup:100,baik:90,note:'Belanja relatif terhadap pendapatan.',calc:D=>D.TotalBelanja/D.TotalPend*100},
    {key:'belmodal',cat:'Efisiensi & Belanja',name:'Rasio Belanja Modal',formula:'Belanja Modal ÷ Total Belanja',unit:'%',dir:1,cukup:15,baik:25,note:'Porsi belanja modal/pembangunan.',calc:D=>D.BelModal/D.TotalBelanja*100},
    {key:'belpeg',cat:'Efisiensi & Belanja',name:'Rasio Belanja Pegawai',formula:'Belanja Pegawai ÷ Total Belanja',unit:'%',dir:-1,cukup:50,baik:40,note:'Beban belanja pegawai terhadap total.',calc:D=>D.BelPegawai/D.TotalBelanja*100},
    {key:'operasi',cat:'Kinerja Operasional (LO)',name:'Rasio Operasi',formula:'Beban-LO ÷ Pendapatan-LO',unit:'%',dir:-1,cukup:100,baik:95,note:'Efisiensi operasional (surplus/defisit-LO).',calc:D=>D.BebanLO/D.PendLO*100},
    {key:'tumbuhpend',cat:'Kinerja Operasional (LO)',name:'Pertumbuhan Pendapatan-LO',formula:'Δ Pendapatan-LO thd th lalu',unit:'%',dir:1,cukup:0,baik:5,note:'Tren pertumbuhan pendapatan operasional.',calc:D=>(D.PendLO-D.PendLOprev)/D.PendLOprev*100},
    {key:'tumbuhek',cat:'Kinerja Operasional (LO)',name:'Pertumbuhan Ekuitas',formula:'Δ Ekuitas thd awal tahun',unit:'%',dir:1,cukup:0,baik:3,note:'Perubahan kekayaan bersih daerah.',calc:D=>(D.Ekuitas-D.EkuitasAwal)/D.EkuitasAwal*100},
  ]; },
  lapRatios(rid,year){
    const D=this.lapDrivers(rid,year), cats=[], byCat={};
    this.lapRatioDefs().forEach(d=>{
      const v=d.calc(D), st=statusByDir(v,d.dir,d.cukup,d.baik);
      if(!byCat[d.cat]){ byCat[d.cat]={name:d.cat,items:[]}; cats.push(byCat[d.cat]); }
      byCat[d.cat].items.push({label:d.name,val:fmtRatio(v,d.unit),formula:d.formula,note:d.note,st});
    });
    return cats;
  },
};

  if(state.unit==='triliun') return (v/1000).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+'T';
  return Math.round(v).toLocaleString('id-ID');
}
function fmtPct(x){ return x.toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'; }
function fmtAmt(v){ if(v===null||v===undefined) return ''; if(v<0) return '('+fmt(-v)+')'; return fmt(v); }
function fmtRatio(v,unit){ return unit==='x' ? v.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+'×' : fmtPct(v); }

function statusFor(key,val){
  const c=DataService.ratioCfg()[key]; let label;
  if(c.dir>0) label = val>=c.good?'Baik':val>=c.mid?'Cukup':'Perlu Perhatian';
  else label = val<=c.good?'Baik':val<=c.mid?'Cukup':'Perlu Perhatian';
  const tone = label==='Baik'?'good':label==='Cukup'?'mid':'bad';
  return {label,tone};
}
function statusByDir(val,dir,cukup,baik){ let lab; if(dir>0) lab=val>=baik?'Baik':val>=cukup?'Cukup':'Perlu Perhatian'; else lab=val<=baik?'Baik':val<=cukup?'Cukup':'Perlu Perhatian'; return {label:lab,tone:lab==='Baik'?'good':lab==='Cukup'?'mid':'bad'}; }
function tonePill(tone){
  if(tone==='good') return 'background:rgba(40,152,101,.15);color:var(--green2,#289865)';
  if(tone==='mid') return 'background:rgba(212,175,55,.18);color:var(--gold-dark,#7A631A)';
  return 'background:rgba(194,75,51,.15);color:#C24B33';
}
function toneColor(tone){ return tone==='good'?'var(--green2,#289865)':tone==='mid'?'var(--gold-dark,#7A631A)':'#C24B33'; }

/* =========================================================================
 * CHART BUILDER
 * ========================================================================= */
function buildLine(vals,W,H){
  const pl=44,pr=10,pt=26,pb=34;
  const min=Math.min(...vals)*0.92, max=Math.max(...vals)*1.04, rng=(max-min)||1;
  const n=vals.length;
  const pts=vals.map((v,i)=>{
    const x=pl+(W-pl-pr)*(n===1?0.5:i/(n-1));
    const y=pt+(H-pt-pb)*(1-(v-min)/rng);
    return {x:+x.toFixed(1),y:+y.toFixed(1),v};
  });
  const poly=pts.map(p=>p.x+','+p.y).join(' ');
  const area='M'+pts[0].x+','+pts[0].y+' '+pts.map(p=>'L'+p.x+','+p.y).join(' ')+' L'+pts[n-1].x+','+(H-pb)+' L'+pts[0].x+','+(H-pb)+' Z';
  return {pts,poly,area,top:pt,bot:H-pb};
}

  if(!inp){ setState({uploadName:'APBD_'+state.year+'_contoh.xlsx'}); return; }
  inp.onchange=()=>{ pendingFile=inp.files&&inp.files[0]; if(pendingFile) setState({uploadName:pendingFile.name,importError:null}); };
  inp.click();
}
async function doImport(){
  if(!insforgeOn()){ runImport(); return; } // demo animation
  if(state.importing) return;
  if(!pendingFile){ setState({importError:'Pilih file Excel laporan BPK terlebih dahulu.'}); return; }
  const region=(document.getElementById('impRegion')||{}).value;
  const year=+((document.getElementById('impYear')||{}).value)||state.year;
  const audited=!!(document.getElementById('impAudited')||{}).checked;
  setState({importing:true,importDone:false,importError:null});
  try{
    const res=await window.APBD.importFile(pendingFile,region,year,audited);
    // re-hydrate the remote cache so the dashboard reflects the new data
    if(window.APBD.refresh){ try{ await window.APBD.refresh(); }catch(e){} }
    pendingFile=null;
    setState({importing:false,importDone:true,
      importMsg:`Data ${region.toUpperCase()} TA ${year} tersimpan (${res&&res.statementLines||0} baris laporan).`,
      newRecCount:(res&&res.recommendations)||3, uploadName:'Belum ada file dipilih'});
  }catch(e){
    setState({importing:false,importError:'Impor gagal: '+(e&&e.message?e.message:'lihat console untuk detail.')});
  }
}
function toggleChip(key,id){
  const arr=state[key]; let nc;
  if(arr.includes(id)) nc=arr.filter(x=>x!==id);
  else if(arr.length>=4) nc=arr;

          <div style="width:6px;height:6px;border-radius:50%;background:var(--gold,#D4AF37)"></div>
          <span style="font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold-dark,#7A631A)">Ringkasan Provinsi · ${year}</span>
        </div>
        <h1 style="font-family:'Lora',serif;font-weight:700;font-size:30px;letter-spacing:-.5px;line-height:1.1">Keuangan Daerah Nusa Tenggara Barat</h1>
        <p style="margin-top:7px;font-size:13.5px;color:var(--muted,#62736A);max-width:560px">Rangkuman APBD 1 provinsi & 10 kabupaten/kota — bersumber dari laporan yang telah diaudit BPK.</p>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px">${kpiHtml}</div>
    <div style="display:grid;grid-template-columns:1.55fr 1fr;gap:14px">
      <div style="display:flex;flex-direction:column;gap:14px;min-width:0">${mapCard}</div>

}

    {label:'Belanja Modal',value:fmt(df.realizedExp*df.bd.modal),bar:'var(--gold-dark,#7A631A)',sub:fmtPct(df.bd.modal*100)+' dari belanja'},

  const comp=DataService.belanjaComp(S.region,year);
  const compTotal=comp.reduce((s,x)=>s+x.value,0)||1;
  const segs=comp.map(c=>({label:c.label,v:c.value/compTotal,color:c.color}));
  let acc=0; const stops=segs.map(s=>{const a=acc*360,b=(acc+s.v)*360;acc+=s.v;return s.color+' '+a.toFixed(1)+'deg '+b.toFixed(1)+'deg';});
  const donutLegend=segs.map(s=>`<div style="display:flex;align-items:center;gap:9px">

  const detVals=YEARS.map(y=>DataService.summary(S.region,y).realizedRev);

    <text x="${p.x}" y="${p.y-11}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--text,#16271E)">${fmtShort(p.v)}</text>
    <text x="${p.x}" y="194" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--muted,#62736A)">${YEARS[i]}</text>`).join('');

  const mkRow=(label,planned,realized,head)=>{const pct=planned?realized/planned*100:0;return `<div style="display:grid;grid-template-columns:1fr 110px 110px 60px;gap:6px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border,#dce6dd);${head?'background:var(--surface2,#EAF1EA)':''}">

      <div style="text-align:right;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums">${fmt(realized)}</div>
      <div style="text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:${pct>=90?'var(--green2,#289865)':pct>=75?'var(--gold-dark,#7A631A)':'#C24B33'}">${fmtPct(pct)}</div>

  const rows=[
    mkRow('PENDAPATAN',df.plannedRev,df.realizedRev,true),
    mkRow('&nbsp;&nbsp;PAD',df.padPlanned,df.padRealized),
    mkRow('&nbsp;&nbsp;Dana Transfer',df.transfer,df.transferReal),
    mkRow('BELANJA',df.plannedExp,df.realizedExp,true),
    mkRow('&nbsp;&nbsp;Belanja Pegawai',df.plannedExp*df.bd.pegawai,df.realizedExp*df.bd.pegawai),
    mkRow('&nbsp;&nbsp;Barang & Jasa',df.plannedExp*df.bd.barang,df.realizedExp*df.bd.barang),
    mkRow('&nbsp;&nbsp;Belanja Modal',df.plannedExp*df.bd.modal,df.realizedExp*df.bd.modal),
  ].join('');

  return `<div>
    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px">
      <div>
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
          <div style="width:6px;height:6px;border-radius:50%;background:var(--gold,#D4AF37)"></div>
          <span style="font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold-dark,#7A631A)">Detail Daerah · ${year}</span>
        </div>
        <h1 style="font-family:'Lora',serif;font-weight:700;font-size:28px;letter-spacing:-.4px">${det.name}</h1>
      </div>
      <select ${da({act:'setregion'})} style="height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--border,#dce6dd);background:var(--surface,#fff);color:var(--text,#16271E);font-weight:700;font-size:13px;cursor:pointer">${regionOpts}</select>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px">${detKpis}</div>
    <div style="display:grid;grid-template-columns:340px 1fr;gap:14px">
      <div style="background:var(--surface,#fff);border:1px solid var(--border,#dce6dd);border-radius:16px;padding:18px 20px">
        <h3 style="font-size:14.5px;font-weight:700;margin-bottom:14px">Komposisi Belanja</h3>
        <div style="display:flex;justify-content:center;margin:4px 0 16px">
          <div style="position:relative;width:182px;height:182px;border-radius:50%;background:conic-gradient(${stops.join(',')})">
            <div style="position:absolute;inset:30px;border-radius:50%;background:var(--surface,#fff);display:flex;flex-direction:column;align-items:center;justify-content:center">
              <div style="font-size:10px;color:var(--muted,#62736A);font-weight:600">Total Belanja</div>
              <div style="font-size:17px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums">${fmtShort(df.realizedExp)}</div>
            </div>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:9px">${donutLegend}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
        <div style="background:var(--surface,#fff);border:1px solid var(--border,#dce6dd);border-radius:16px;padding:18px 20px">
          <h3 style="font-size:14.5px;font-weight:700;margin-bottom:6px">Tren Realisasi 2021–2025</h3>
          <svg viewBox="0 0 700 200" style="width:100%;height:auto;display:block">
            <defs><linearGradient id="ntbArea2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--gold,#D4AF37)" stop-opacity="0.3"/><stop offset="100%" stop-color="var(--gold,#D4AF37)" stop-opacity="0"/></linearGradient></defs>
            <path d="${L2.area}" fill="url(#ntbArea2)"/>
            <polyline points="${L2.poly}" fill="none" stroke="var(--gold-dark,#7A631A)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
            ${dots2}
          </svg>
        </div>
        <div style="background:var(--surface,#fff);border:1px solid var(--border,#dce6dd);border-radius:16px;padding:18px 20px">
          <h3 style="font-size:14.5px;font-weight:700;margin-bottom:12px">Rincian Anggaran vs Realisasi</h3>
          <div style="display:grid;grid-template-columns:1fr 110px 110px 60px;gap:6px 10px;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted,#62736A);padding-bottom:8px;border-bottom:1px solid var(--border,#dce6dd)">
            <div>Komponen</div><div style="text-align:right">Anggaran</div><div style="text-align:right">Realisasi</div><div style="text-align:right">%</div>
          </div>
          ${rows}
        </div>

    <div style="margin-top:14px;display:flex;justify-content:flex-end">
      <button ${da({act:'gorek',region:S.region})} style="height:42px;padding:0 18px;border-radius:11px;border:0;background:linear-gradient(135deg,var(--green,#1B6744),var(--green2,#289865));color:#fff;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 8px 20px -8px rgba(27,103,68,.6)">Lihat Area Fokus <span>→</span></button>
    </div>
  </div>`;
}

function viewLaporan(){
  const S=state, year=S.year, regions=DataService.regions(), kab=regions.filter(r=>r.id!=='prov');
  const lapReg=DataService.regionById(S.region);
  const regionOpts=regions.map(r=>`<option value="${r.id}" ${r.id===S.region?'selected':''}>${r.name}</option>`).join('');
  const tab=S.laporanTab;
  const def=DataService.statementTabs().find(t=>t.id===tab);
  const isBima=DataService.audited(S.region,year);
  const lapTabs=DataService.statementTabs().map(t=>`<button ${da({act:'laptab',val:t.id})} title="${t.full}" style="${segTab(tab===t.id)}">${t.label}</button>`).join('');

  // single (per-daerah) mode
  const stmt=DataService.statement(S.region,year,tab);
  const f=DataService.lapFactorFor(S.region,year);
  const lapGrid='minmax(0,1fr) '+stmt.cols.map(()=>'minmax(78px,118px)').join(' ');
  const colHead=stmt.cols.map(c=>`<div style="font-size:10.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--muted,#62736A);text-align:right">${c}</div>`).join('');
  const stmtRows=stmt.rows.map(row=>{
    const bold=row.k==='t', sub=row.k==='s';
    const cells=stmt.cols.map((c,ci)=>{
      if(stmt.pctCol===ci){
        const a=row.v[0], r=row.v[1]; let txt;
        if(typeof row.v[2]==='string') txt=row.v[2];
        else if(a&&a!==0) txt=fmtPct(r/a*100); else txt='–';
        return {t:txt,color:'var(--muted,#62736A)',w:'600'};
      }
      if(stmt.growthCol){
        if(ci===2){ const ch=row.v[0]-row.v[1]; return {t:fmtAmt(ch*f),color:ch<0?'#C24B33':'inherit',w:'600'}; }
        if(ci===3){ const ch=row.v[0]-row.v[1]; const p=row.v[1]!==0?ch/Math.abs(row.v[1])*100:null; return {t:p===null?'–':fmtPct(p),color:p<0?'#C24B33':'var(--muted,#62736A)',w:'600'}; }
        const val=row.v[ci]; return {t:val===null?'':fmtAmt(val*f),color:val<0?'#C24B33':'inherit',w:bold?'800':'600'};
      }
      const val=row.v[ci]; return {t:val===null?'':fmtAmt(val*f),color:val<0?'#C24B33':'inherit',w:bold?'800':'600'};
    });
    const cellHtml=cells.map(c=>`<div style="text-align:right;font-size:12.5px;font-weight:${c.w};color:${c.color};font-variant-numeric:tabular-nums">${c.t}</div>`).join('');
    return `<div style="display:grid;grid-template-columns:${lapGrid};gap:4px 10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border,#dce6dd);background:${bold?'var(--surface2,#EAF1EA)':'transparent'}">
        <div style="font-size:12.5px;font-weight:${bold?'800':sub?'700':'500'};color:${bold||sub?'var(--text,#16271E)':'var(--muted,#62736A)'};padding-left:${row.lv*15}px">${row.l}</div>
        ${cellHtml}
      </div>`;
  }).join('');

  const ratioCats=DataService.lapRatios(S.region,year).map(cat=>`
    <div style="background:var(--surface,#fff);border:1px solid var(--border,#dce6dd);border-radius:16px;padding:18px 20px">
      <h3 style="font-size:14.5px;font-weight:700;margin-bottom:13px">${cat.name}</h3>
      <div style="display:flex;flex-direction:column;gap:13px">
        ${cat.items.map(it=>`<div style="display:flex;gap:12px;align-items:flex-start">
          <div style="width:3px;align-self:stretch;border-radius:3px;background:${toneColor(it.st.tone)};flex-shrink:0;min-height:42px"></div>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
            <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
              <span style="font-size:12.5px;font-weight:700;line-height:1.25">${it.label}</span>
              <span style="font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;flex-shrink:0">${it.val}</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span style="font-size:9px;font-weight:800;letter-spacing:.3px;padding:2px 7px;border-radius:6px;flex-shrink:0;${tonePill(it.st.tone)}">${it.st.label}</span>
              <span style="font-size:10.5px;color:var(--muted,#62736A);font-style:italic">${it.formula}</span>
            </div>
            <p style="font-size:11.5px;line-height:1.45;color:var(--muted,#62736A)">${it.note}</p>
          </div>
        </div>`).join('')}
      </div>
    </div>`).join('');

  const singleHtml=`<div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">${lapTabs}</div>
    <div style="background:var(--surface,#fff);border:1px solid var(--border,#dce6dd);border-radius:16px;padding:18px 20px;margin-bottom:18px">
      <div style="margin-bottom:14px">
        <h3 style="font-size:16px;font-weight:700;font-family:'Lora',serif">${def.full}</h3>
        <p style="font-size:12px;color:var(--muted,#62736A);margin-top:3px">Untuk periode yang berakhir 31 Desember ${year} · (dalam ${S.unit==='triliun'?'triliun':'miliar'} rupiah)</p>
      </div>
      <div class="ntb-scroll" style="overflow-x:auto"><div style="min-width:540px">
        <div style="display:grid;grid-template-columns:${lapGrid};gap:4px 10px;padding:0 12px 9px;border-bottom:1.5px solid var(--border,#dce6dd)">
          <div style="font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted,#62736A)">Uraian</div>${colHead}
        </div>
        ${stmtRows}
      </div></div>
    </div>
    <div style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:5px">
        <div style="width:6px;height:6px;border-radius:50%;background:var(--gold,#D4AF37)"></div>
        <span style="font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold-dark,#7A631A)">Analisis Rasio</span>
      </div>
      <h2 style="font-family:'Lora',serif;font-weight:700;font-size:22px;letter-spacing:-.3px">Analisis Rasio atas Laporan Keuangan</h2>
      <p style="margin-top:6px;font-size:13px;color:var(--muted,#62736A);max-width:640px">Rasio dihitung langsung dari pos-pos Neraca, LRA, dan LO. Label menilai tiap rasio terhadap ambang batas standar keuangan daerah.</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px">${ratioCats}</div>
  </div>`;

  // compare mode
  const lc=S.lapCompare;
  const lapChips=kab.map(r=>`<button ${da({act:'lapchip',region:r.id})} style="${chipStyle(lc.includes(r.id))}">${r.short}</button>`).join('');
  const cmpRegs=lc.map((id,i)=>({short:DataService.regionById(id).short,color:PALETTE[i%PALETTE.length]}));
  const cmpHead=cmpRegs.map(c=>`<div style="font-size:11px;font-weight:800;text-align:right;color:${c.color}">${c.short}</div>`).join('');
  const lapCmpGrid='minmax(0,1.7fr) '+lc.map(()=>'minmax(70px,1fr)').join(' ');
  const valIdx = tab==='LRA' ? 1 : 0;
  const lapNorm=s=>String(s||'').toUpperCase().replace(/\s+/g,' ').trim();
  // Align values by Uraian (VLOOKUP) instead of row position — regions have
  // different row counts (e.g. KSB). ref_code isn't present for every region, so
  // we key on the label and disambiguate repeated Uraian (e.g. "Belanja Tidak
  // Terduga") by their Nth occurrence within the statement.
  const cmpCols=lc.map(id=>{ const st=DataService.statement(id,year,tab); const m={};
    st.rows.forEach(r=>{ const k=lapNorm(r.l); (m[k]=m[k]||[]).push(r); });
    return {st, byLabel:m, fr:DataService.lapFactorFor(id,year)}; });
  // Use the most complete statement (most rows) as the Uraian template so no
  // region's lines are dropped.
  const cstmt=cmpCols.reduce((a,c)=>(!a||c.st.rows.length>a.rows.length?c.st:a),null)||DataService.statement(lc[0]||S.region,year,tab);
  const lapSeen={};
  const cmpRows=cstmt.rows.map((row)=>{
    const key=lapNorm(row.l); const occ=(lapSeen[key]=(lapSeen[key]||0)+1)-1;
    const bold=row.k==='t', sub=row.k==='s';
    const cells=cmpCols.map(({byLabel,fr})=>{
      const arr=byLabel[key]; const rr=arr&&arr[occ];
      // Rp0 when this region has no data for this Uraian; '' only when the line
      // exists but the cell itself is empty (e.g. a section header).
      const raw=rr?rr.v[valIdx]:0;
      const v=(rr&&(raw===null||raw===undefined))?null:((raw||0)*fr);
      return `<div style="text-align:right;font-size:12.5px;font-weight:${bold?'800':'600'};color:${(v!==null&&v<0)?'#C24B33':'inherit'};font-variant-numeric:tabular-nums">${v===null?'':fmtAmt(v)}</div>`; }).join('');
    return `<div style="display:grid;grid-template-columns:${lapCmpGrid};gap:4px 10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border,#dce6dd);background:${bold?'var(--surface2,#EAF1EA)':'transparent'}">
        <div style="font-size:12.5px;font-weight:${bold?'800':sub?'700':'500'};color:${bold||sub?'var(--text,#16271E)':'var(--muted,#62736A)'};padding-left:${row.lv*14}px">${row.l}</div>${cells}
      </div>`;
  }).join('');

  const compareHtml=`<div>
    <p style="font-size:13.5px;color:var(--muted,#62736A);max-width:680px;margin-bottom:14px">Pilih jenis laporan dan daerah untuk membandingkan laporan keuangannya berdampingan (maks. 4 daerah).</p>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">${lapTabs}</div>
    <div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px">${lapChips}</div>
    <div style="background:var(--surface,#fff);border:1px solid var(--border,#dce6dd);border-radius:16px;padding:18px 20px">
      <div style="margin-bottom:12px">
        <h3 style="font-size:16px;font-weight:700;font-family:'Lora',serif">${def.full}</h3>

function viewRasio(){
  const S=state, year=S.year, regions=DataService.regions(), kab=regions.filter(r=>r.id!=='prov');
  const cfg=DataService.ratioCfg(), cmp=S.compare;
  const chips=kab.map(r=>`<button ${da({act:'rasiochip',region:r.id})} style="${chipStyle(cmp.includes(r.id))}">${r.short}</button>`).join('');
  const cmpReg=cmp.map((id,i)=>({id,name:DataService.regionById(id).name,color:PALETTE[i%PALETTE.length]}));
  const cols=cmpReg.map(c=>`<th style="text-align:center;font-size:11px;font-weight:700;padding:0 4px 9px;color:${c.color}">${c.name}</th>`).join('');
  const keys=['ddf','rkk','efektivitas','efisiensi','bmodal','ketergantungan'];
  const rows=keys.map(k=>{
    const cells=cmp.map(id=>{const v=DataService.ratios(id,year)[k];const st=statusFor(k,v);
      return `<td style="padding:11px 4px;text-align:center"><div style="font-size:14px;font-weight:800;font-variant-numeric:tabular-nums">${fmtPct(v)}</div><div style="display:inline-block;margin-top:4px;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:6px;${tonePill(st.tone)}">${st.label}</div></td>`;}).join('');
    return `<tr style="border-top:1px solid var(--border,#dce6dd)">
        <td style="padding:11px 8px 11px 0;max-width:180px"><div style="font-size:12.5px;font-weight:700">${cfg[k].label}</div><div style="font-size:10.5px;color:var(--muted,#62736A);margin-top:1px">${cfg[k].desc}</div></td>${cells}
      </tr>`;
  }).join('');

  // radar
  const cx=160,cy=148,R=92,AX=[{k:'ddf',l:'DDF'},{k:'rkk',l:'Mandiri'},{k:'efektivitas',l:'Efektif'},{k:'efisiensi',l:'Efisien'},{k:'bmodal',l:'B.Modal'},{k:'ketergantungan',l:'Tergantung'}];
  const RMAX={ddf:55,rkk:130,efektivitas:115,efisiensi:120,bmodal:42,ketergantungan:100};
  const ang=i=>(-90+i*60)*Math.PI/180;
  const axes=AX.map((a,i)=>{const c=Math.cos(ang(i)),s=Math.sin(ang(i));const lr=R+16;const anchor=Math.abs(c)<0.3?'middle':c>0?'start':'end';
    return `<line x1="160" y1="148" x2="${(cx+R*c).toFixed(1)}" y2="${(cy+R*s).toFixed(1)}" stroke="var(--border,#dce6dd)" stroke-width="1"/><text x="${(cx+lr*c).toFixed(1)}" y="${(cy+lr*s+3).toFixed(1)}" text-anchor="${anchor}" font-size="9.5" font-weight="700" fill="var(--muted,#62736A)">${a.l}</text>`;}).join('');
  const rings=[0.34,0.67,1].map(fr=>`<polygon points="${AX.map((a,i)=>(cx+R*fr*Math.cos(ang(i))).toFixed(1)+','+(cy+R*fr*Math.sin(ang(i))).toFixed(1)).join(' ')}" fill="none" stroke="var(--border,#dce6dd)" stroke-width="1"/>`).join('');
  const shapes=cmpReg.map(c=>{const rt=DataService.ratios(c.id,year);const pts=AX.map((a,i)=>{const n=Math.max(0.05,Math.min(1,rt[a.k]/RMAX[a.k]));return (cx+R*n*Math.cos(ang(i))).toFixed(1)+','+(cy+R*n*Math.sin(ang(i))).toFixed(1);}).join(' ');return `<polygon points="${pts}" fill="${c.color}2e" stroke="${c.color}" stroke-width="2"/>`;}).join('');
  const legend=cmpReg.map(c=>`<div style="display:flex;align-items:center;gap:8px"><span style="width:11px;height:11px;border-radius:3px;background:${c.color}"></span><span style="font-size:12px;font-weight:600">${c.name}</span></div>`).join('');

  return `<div>
    <div style="margin-bottom:18px">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
        <div style="width:6px;height:6px;border-radius:50%;background:var(--gold,#D4AF37)"></div>
        <span style="font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold-dark,#7A631A)">Analisis Rasio Kinerja · ${year}</span>
      </div>
      <h1 style="font-family:'Lora',serif;font-weight:700;font-size:28px;letter-spacing:-.4px">Rasio Kinerja Keuangan</h1>
      <p style="margin-top:7px;font-size:13.5px;color:var(--muted,#62736A);max-width:620px">Pilih daerah untuk dibandingkan (maks. 4). Label otomatis menilai tiap rasio terhadap ambang batas standar.</p>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px">${chips}</div>
    <div style="display:grid;grid-template-columns:1fr 360px;gap:14px">
      <div style="background:var(--surface,#fff);border:1px solid var(--border,#dce6dd);border-radius:16px;padding:18px 20px;overflow:auto" class="ntb-scroll">
        <h3 style="font-size:14.5px;font-weight:700;margin-bottom:12px">Tabel Perbandingan Rasio</h3>
        <table style="width:100%;border-collapse:collapse;min-width:560px">
          <thead><tr><th style="text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--muted,#62736A);padding:0 8px 9px 0">Rasio</th>${cols}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="background:var(--surface,#fff);border:1px solid var(--border,#dce6dd);border-radius:16px;padding:18px 20px">
        <h3 style="font-size:14.5px;font-weight:700;margin-bottom:4px">Profil Rasio (Radar)</h3>
        <svg viewBox="0 0 320 300" style="width:100%;height:auto;display:block">${rings}${axes}${shapes}</svg>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:10px">${legend}</div>
      </div>
    </div>
  </div>`;
}

        </div>`:''}
      </div>
      <div style="background:var(--surface,#fff);border:1px solid var(--border,#dce6dd);border-radius:16px;padding:20px">
        <h3 style="font-size:14.5px;font-weight:700;margin-bottom:14px">Riwayat Unggahan</h3>
        <div style="display:flex;flex-direction:column">
          <div style="display:grid;grid-template-columns:1fr 70px 86px;gap:8px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted,#62736A);padding-bottom:9px;border-bottom:1px solid var(--border,#dce6dd)"><div>Daerah / Tahun</div><div style="text-align:center">Status</div><div style="text-align:right">Waktu</div></div>
          ${history}
        </div>
      </div>
    </div>
  </div>`;
}

/* =========================================================================
 * SHELL + RENDER
 * ========================================================================= */
const VIEWS=[{id:'beranda',label:'Beranda'},{id:'detail',label:'Detail Daerah'},{id:'laporan',label:'Laporan Keuangan'},{id:'rasio',label:'Rasio Keuangan'},{id:'rekomendasi',label:'Area Fokus'},{id:'admin',label:'Admin'}];
const CRUMB={beranda:'Ringkasan Provinsi',detail:'Detail Daerah',laporan:'Laporan Keuangan',rasio:'Analisis Rasio Kinerja',rekomendasi:'Area Fokus',admin:'Panel Admin'};

function viewBody(){
  switch(state.view){
    case 'beranda': return viewBeranda();
    case 'detail': return viewDetail();
    case 'laporan': return viewLaporan();
    case 'rasio': return viewRasio();
    case 'rekomendasi': return viewRek();
    case 'admin': return viewAdmin();
    default: return viewBeranda();
  }
}

function render(){
  const S=state, dark=getDark();
  const pageBg=dark?'#0D1611':'#F1F5F0';
  document.documentElement.setAttribute('style', themeVars()+'background:'+pageBg);

  const nav=VIEWS.map(v=>{const on=S.view===v.id;
    return `<button ${da({act:'view',view:v.id})} style="${navStyle(on)}"><span style="width:6px;height:6px;border-radius:50%;background:${on?'rgba(255,255,255,.85)':'var(--border,#dce6dd)'};flex-shrink:0"></span>${v.label}</button>`;
  }).join('');

  const years=YEARS_DYNAMIC.map(y=>`<option value="${y}" ${y===S.year?'selected':''}>TA ${y}</option>`).join('');

  document.getElementById('app').innerHTML=`
  <div style="min-height:100vh;display:flex;background:${pageBg}">
    <aside style="position:sticky;top:0;align-self:flex-start;height:100vh;width:238px;flex-shrink:0;display:flex;flex-direction:column;background:var(--surface,#fff);border-right:1px solid var(--border,#dce6dd)">
      <div style="padding:22px 20px 20px;display:flex;align-items:center;gap:12px">
        <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--green,#1B6744),var(--green2,#289865));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px -3px rgba(27,103,68,.5);flex-shrink:0">
          <div style="width:14px;height:14px;background:var(--gold,#D4AF37);transform:rotate(45deg);border-radius:2px"></div>
        </div>
        <div style="line-height:1.1">
          <div style="font-family:'Lora',serif;font-weight:700;font-size:17px;letter-spacing:-.2px;color:var(--text,#16271E)">APBD NTB</div>
          <div style="font-size:9.5px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--muted,#62736A)">Transparansi Keuangan</div>
        </div>
      </div>
      <nav style="flex:1;padding:10px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto" class="ntb-scroll">
        <div style="font-size:9.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted,#62736A);padding:6px 12px 4px">Menu</div>
        ${nav}
      </nav>
    </aside>

    <div style="flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh">
      <header style="position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);background:var(--headbg,rgba(241,245,240,.85));border-bottom:1px solid var(--border,#dce6dd)">
        <div style="padding:0 26px;height:64px;display:flex;align-items:center;gap:14px">
          <div style="flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--muted,#62736A)">${CRUMB[S.view]||''}</div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
            <div style="display:flex;align-items:center;gap:7px;padding:0 10px;height:36px;border-radius:9px;background:var(--surface,#fff);border:1px solid var(--border,#dce6dd)">
              <span style="font-size:11px;font-weight:600;color:var(--muted,#62736A)">Tahun</span>
              <select ${da({act:'year'})} style="border:0;background:transparent;font-weight:700;font-size:13px;color:var(--text,#16271E);outline:none;cursor:pointer">${years}</select>
            </div>
            <button ${da({act:'unit'})} title="Satuan" style="height:36px;padding:0 11px;border-radius:9px;border:1px solid var(--border,#dce6dd);background:var(--surface,#fff);color:var(--muted,#62736A);font-weight:700;font-size:12px;cursor:pointer">${S.unit==='miliar'?'Miliar':'Triliun'}</button>
            <button ${da({act:'dark'})} title="Mode gelap" style="width:36px;height:36px;border-radius:9px;border:1px solid var(--border,#dce6dd);background:var(--surface,#fff);color:var(--text,#16271E);font-weight:700;cursor:pointer;font-size:14px">${dark?'☀':'☾'}</button>
          </div>
        </div>
      </header>

      <main style="flex:1;max-width:1320px;width:100%;margin:0 auto;padding:26px 26px 60px">${viewBody()}</main>
    </div>
  </div>`;
}

/* =========================================================================
 * EVENT DELEGATION
 * ========================================================================= */
const app=document.getElementById('app');
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset;
  switch(a.act){
    case 'view': setState({view:a.view}); break;
    case 'godetail': setState({region:a.region,view:'detail'}); break;
    case 'mapidn': setState({mapLevel:'indonesia',mapHover:null}); break;
    case 'mapntb': setState({mapLevel:'ntb',mapHover:null}); break;
    case 'metric': setState({metric:a.val}); break;
    case 'trendmetric': setState({trendMetric:a.val}); break;
    case 'unit': setState({unit:state.unit==='miliar'?'triliun':'miliar'}); break;
    case 'dark': setState({dark:!getDark()}); break;
    case 'laptab': setState({laporanTab:a.val}); break;
    case 'lapmode': setState({lapMode:a.val}); break;
    case 'lapchip': toggleChip('lapCompare',a.region); break;
    case 'rasiochip': toggleChip('compare',a.region); break;
    case 'rekpri': setState({rekPri:a.val}); break;
    case 'login': doLogin(); break;
    case 'logout': doLogout(); break;
    case 'pickfile': doPickFile(); break;
    case 'import': doImport(); break;
    case 'gorek': setState({view:'rekomendasi',rekRegion:a.region}); break;
    case 'recref': handleRecRef(a.ref,a.region); break;
  }
});
app.addEventListener('change',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset;
  if(a.act==='year') setState({year:+e.target.value});
  else if(a.act==='setregion') setState({region:e.target.value});
  else if(a.act==='rekregion') setState({rekRegion:e.target.value});
});
// map hover (mouseover/mouseout bubble; guard to avoid redundant re-renders)
app.addEventListener('mouseover',e=>{
  const t=e.target.closest('[data-hover]'); if(!t) return;
  const id=t.dataset.hover;
  if(state.mapHover!==id) setState({mapHover:id});
});
app.addEventListener('mouseout',e=>{
  const t=e.target.closest('[data-hover]'); if(!t) return;
  const to=e.relatedTarget&&e.relatedTarget.closest?e.relatedTarget.closest('[data-hover]'):null;
  if(to===t) return;
  if(state.mapHover!==null) setState({mapHover:null});
});

// Initial render. If InsForge is configured, hydrate the remote cache first so
// the first paint already reflects database values; otherwise render immediately
// in offline/demo mode.
(function boot(){
  if (typeof window!=='undefined' && window.APBD && window.APBD.configured()) {
    render(); // paint demo data immediately so the UI is responsive
    Promise.resolve(window.APBD.ready).then((ok)=>{
      if (ok) {
        // sync available years from DB into the selector, keep current if present
        try { if (window.APBD.store.years && window.APBD.store.years.length) {
          YEARS_DYNAMIC = window.APBD.store.years.slice();
          if (!YEARS_DYNAMIC.includes(state.year)) state.year = YEARS_DYNAMIC[YEARS_DYNAMIC.length-1];
        } } catch(e){}
        render(); // repaint with live data
      }
    });
  } else {
    render();
  }
})();

})();
</script>
</body>
</html>
