  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x}\n<\u002Fstyle>\n<script src=\"8ca89c53-9162-4347-8106-cf32e9b35002\"><\u002Fscript>\n<\u002Fhelmet>\n\n\n\n<div style=\"min-height:100vh;display:flex;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text,#16271E);background:{{ pageBg }};{{ themeVars }}\">\n\n  <!-- ===== SIDEBAR ===== -->\n  <aside style=\"position:sticky;top:0;align-self:flex-start;height:100vh;width:238px;flex-shrink:0;display:flex;flex-direction:column;background:var(--surface,#fff);border-right:1px solid var(--border,#dce6dd)\">\n    <div style=\"padding:22px 20px 20px;display:flex;align-items:center;gap:12px\">\n      <div style=\"width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--green,#1B6744),var(--green2,#289865));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px -3px rgba(27,103,68,.5);flex-shrink:0\">\n        <div style=\"width:14px;height:14px;background:var(--gold,#D4AF37);transform:rotate(45deg);border-radius:2px\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"line-height:1.1\">\n        <div style=\"font-family:'Lora',serif;font-weight:700;font-size:17px;letter-spacing:-.2px;color:var(--text,#16271E)\">APBD NTB<\u002Fdiv>\n        <div style=\"font-size:9.5px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--muted,#62736A)\">Transparansi Keuangan<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <nav style=\"flex:1;padding:10px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto\" class=\"ntb-scroll\">\n      <div style=\"font-size:9.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted,#62736A);padding:6px 12px 4px\">Menu<\u002Fdiv>\n      <sc-for list=\"{{ navItems }}\" as=\"nav\" hint-placeholder-count=\"6\">\n        <button onclick=\"{{ nav.onClick }}\" style=\"{{ nav.btnStyle }}\"><span style=\"width:6px;height:6px;border-radius:50%;background:{{ nav.dot }};flex-shrink:0\"><\u002Fspan>{{ nav.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n    <div style=\"padding:16px 18px;border-top:1px solid var(--border,#dce6dd);font-size:10.5px;line-height:1.5;color:var(--muted,#62736A)\">Sumber: laporan APBD audit BPK · data ilustratif untuk pratinjau.<\u002Fdiv>\n  <\u002Faside>\n\n  <!-- ===== MAIN COLUMN ===== -->\n  <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh\">\n\n  <!-- top control bar -->\n  <header style=\"position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);background:var(--headbg,rgba(241,245,240,.85));border-bottom:1px solid var(--border,#dce6dd)\">\n    <div style=\"padding:0 26px;height:64px;display:flex;align-items:center;gap:14px\">\n      <div style=\"flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--muted,#62736A)\">{{ pageCrumb }}<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;flex-shrink:0\">\n        <div style=\"display:flex;align-items:center;gap:7px;padding:0 10px;height:36px;border-radius:9px;background:var(--surface,#fff);border:1px solid var(--border,#dce6dd)\">\n          <span style=\"font-size:11px;font-weight:600;color:var(--muted,#62736A)\">Tahun<\u002Fspan>\n          <select value=\"{{ yearStr }}\" onchange=\"{{ onYear }}\" style=\"border:0;background:transparent;font-weight:700;font-size:13px;color:var(--text,#16271E);outline:none;cursor:pointer\">\n            <sc-for list=\"{{ years }}\" as=\"y\" hint-placeholder-count=\"5\"><option value=\"{{ y.v }}\">{{ y.label }}<\u002Foption><\u002Fsc-for>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <button onclick=\"{{ onUnit }}\" title=\"Satuan\" style=\"height:36px;padding:0 11px;border-radius:9px;border:1px solid var(--border,#dce6dd);background:var(--surface,#fff);color:var(--muted,#62736A);font-weight:700;font-size:12px;cursor:pointer\">{{ unitLabel }}<\u002Fbutton>\n        <button onclick=\"{{ onExport }}\" title=\"Ekspor CSV\" style=\"height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--border,#dce6dd);background:var(--surface,#fff);color:var(--text,#16271E);font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px\">\n          <span style=\"font-size:14px;line-height:1\">↓<\u002Fspan>CSV\n        <\u002Fbutton>\n        <button onclick=\"{{ onDark }}\" title=\"Mode gelap\" style=\"width:36px;height:36px;border-radius:9px;border:1px solid var(--border,#dce6dd);background:var(--surface,#fff);color:var(--text,#16271E);font-weight:700;cursor:pointer;font-size:14px\">{{ darkIcon }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"flex:1;max-width:1320px;width:100%;margin:0 auto;padding:26px 26px 60px\">\n\n  <!-- ===================== BERANDA ===================== -->\n  <sc-if value=\"{{ isBeranda }}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <!-- title row -->\n      <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px\">\n        <div>\n          <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:7px\">\n            <div style=\"width:6px;height:6px;border-radius:50%;background:var(--gold,#D4AF37)\"><\u002Fdiv>\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold-dark,#7A631A)\">Ringkasan Provinsi · {{ yearStr }}<\u002Fspan>\n          <\u002Fdiv>\n          <h1 style=\"font-family:'Lora',serif;font-weight:700;font-size:30px;letter-spacing:-.5px;line-height:1.1\">Keuangan Daerah Nusa Tenggara Barat<\u002Fh1>\n          <p style=\"margin-top:7px;font-size:13.5px;color:var(--muted,#62736A);max-width:560px\">Rangkuman APBD 1 provinsi &amp; 10 kabupaten/kota — bersumber dari laporan yang telah diaudit BPK.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- KPI cards -->\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px\">\n        <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n          <div style=\"position:relative;overflow:hidden;background:var(--surface,#fff);border:1px solid var(--border,#dce6dd);border-radius:15px;padding:17px 18px;box-shadow:0 1px 2px rgba(20,40,28,.04),0 14px 30px -22px rgba(20,40,28,.3)\">\n            <div style=\"position:absolute;left:0;top:0;bottom:0;width:4px;background:{{ k.bar }}\"><\u002Fdiv>\n            <div style=\"font-size:11.5px;font-weight:600;color:var(--muted,#62736A);letter-spacing:.2px\">{{ k.label }}<\u002Fdiv>\n            <div style=\"font-size:25px;font-weight:800;letter-spacing:-.6px;margin-top:8px;font-variant-numeric:tabular-nums\">{{ k.value }}<\u002Fdiv>\n            <div style=\"margin-top:7px;display:flex;align-items:center;gap:7px\">\n              <span style=\"font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:{{ k.deltaBg }};color:{{ k.deltaFg }}\">{{ k.delta }}<\u002Fspan>\n              <span style=\"font-size:11px;color:var(--muted,#62736A)\">{{ k.sub }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- main grid: map + side -->\n      <div style=\"display:grid;grid-template-columns:1.55fr 1fr;gap:14px\">\n        <!-- LEFT: map + peringkat serapan -->\n        <div style=\"display:flex;flex-direction:column;gap:14px;min-width:0\">\n        <!-- MAP -->\n        <div style=\"background:var(--surface,#fff);border:1px solid var(--border,#dce6dd);border-radius:16px;padding:18px 20px 20px;box-shadow:0 14px 34px -26px rgba(20,40,28,.35)\">\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px\">\n            <div style=\"min-width:0\">\n              <div style=\"display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700\">\n                <button onclick=\"{{ onMapIndonesia }}\" style=\"{{ crumbIdnStyle }}\">Indonesia<\u002Fbutton>\n                <sc-if value=\"{{ mapAtNtb }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:var(--muted,#62736A)\">›<\u002Fspan><span style=\"color:var(--gold-dark,#7A631A)\">Nusa Tenggara Barat<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n              <p style=\"font-size:12px;color:var(--muted,#62736A);margin-top:3px\">{{ mapHint }}<\u002Fp>\n            <\u002Fdiv>\n            <sc-if value=\"{{ mapAtNtb }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;align-items:center;gap:9px;flex-shrink:0\">\n                <span style=\"font-size:10.5px;color:var(--muted,#62736A);font-weight:600\">Rendah<\u002Fspan>\n                <div style=\"width:78px;height:9px;border-radius:6px;background:linear-gradient(90deg,#C9E2D3,#289865,#15512F)\"><\u002Fdiv>\n                <span style=\"font-size:10.5px;color:var(--muted,#62736A);font-weight:600\">Tinggi<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"position:relative;margin-top:8px;border-radius:12px;background:var(--mapsea,#DCE9F2);border:1px solid var(--border,#dce6dd);overflow:hidden\">\n            <!-- INDONESIA LEVEL -->\n            <sc-if value=\"{{ mapAtIndonesia }}\" hint-placeholder-val=\"{{ true }}\">\n              <svg viewBox=\"{{ idnViewBox }}\" style=\"width:100%;height:auto;display:block\">\n                <sc-for list=\"{{ idnProvinces }}\" as=\"p\" hint-placeholder-count=\"32\">\n                  <path d=\"{{ p.path }}\" fill=\"{{ p.fill }}\" stroke=\"{{ p.stroke }}\" stroke-width=\"{{ p.sw }}\" style=\"{{ p.style }}\" onclick=\"{{ p.onClick }}\" onmouseenter=\"{{ p.onEnter }}\" onmouseleave=\"{{ p.onLeave }}\"><\u002Fpath>\n                <\u002Fsc-for>\n                <circle cx=\"{{ idnMarkerX }}\" cy=\"{{ idnMarkerY }}\" r=\"9\" fill=\"none\" stroke=\"var(--gold,#D4AF37)\" stroke-width=\"2.5\" style=\"animation:ntbpulse 1.8s infinite\"><\u002Fcircle>\n              <\u002Fsvg>\n              <button onclick=\"{{ onMapNtb }}\" style=\"position:absolute;left:50%;bottom:14px;transform:translateX(-50%);height:34px;padding:0 16px;border-radius:9px;border:0;background:linear-gradient(135deg,var(--green,#1B6744),var(--green2,#289865));color:#fff;font-weight:700;font-size:12.5px;cursor:pointer;box-shadow:0 8px 18px -7px rgba(27,103,68,.7);display:flex;align-items:center;gap:7px\">Masuk ke Peta NTB <span>→<\u002Fspan><\u002Fbutton>\n            <\u002Fsc-if>\n            <!-- NTB LEVEL -->\n            <sc-if value=\"{{ mapAtNtb }}\" hint-placeholder-val=\"{{ false }}\">\n              <svg viewBox=\"{{ ntbViewBox }}\" style=\"width:100%;height:auto;display:block\">\n                <sc-for list=\"{{ ntbRegions }}\" as=\"r\" hint-placeholder-count=\"10\">\n                  <path d=\"{{ r.path }}\" fill=\"{{ r.fill }}\" stroke=\"{{ r.stroke }}\" stroke-width=\"{{ r.sw }}\" style=\"{{ r.style }}\" onclick=\"{{ r.onClick }}\" onmouseenter=\"{{ r.onEnter }}\" onmouseleave=\"{{ r.onLeave }}\"><\u002Fpath>\n                <\u002Fsc-for>\n                <sc-for list=\"{{ ntbLabels }}\" as=\"l\" hint-placeholder-count=\"10\">\n                  <text x=\"{{ l.x }}\" y=\"{{ l.y }}\" text-anchor=\"middle\" font-size=\"{{ l.size }}\" font-weight=\"800\" fill=\"{{ l.color }}\" style=\"pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.35)\">{{ l.short }}<\u002Ftext>\n                <\u002Fsc-for>\n              <\u002Fsvg>\n              <div style=\"position:absolute;left:12px;top:11px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text,#16271E);opacity:.55\">Lombok<\u002Fdiv>\n              <div style=\"position:absolute;right:12px;top:11px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text,#16271E);opacity:.55\">Sumbawa<\u002Fdiv>\n            <\u002Fsc-if>\n            <!-- hover tooltip -->\n            <sc-if value=\"{{ mapHasHover }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position:absolute;left:12px;botto              <span style=\"width:46px;text-align:right;font-size:12.5px;font-weight:800;color:{{ rankColor }};font-variant-numeric:tabular-nums\">{{ r.ser }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- SIDE: comparison bars + ranking -->\n        <div style=\"display:flex;flex-direction:column;gap:14px;min-width:0\">\n          <div style=\"background:var(--surface,#fff);border:1px solid var(--border,#dce6dd);border-radius:16px;padding:17px 18px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:4px\">\n              <h3 style=\"font-size:14.5px;font-weight:700\">Perbandingan Antar Daerah<\u002Fh3>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:5px;margin:10px 0 6px\">\n              <sc-for list=\"{{ metricTabs }}\" as=\"m\" hint-placeholder-count=\"3\">\n                <button onclick=\"{{ m.onClick }}\" style=\"{{ m.style }}\">{{ m.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px\">\n              <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"10\">\n                <button onclick=\"{{ b.onClick }}\" title=\"{{ b.title }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;height:100%;justify-content:flex-end\">\n                  <div style=\"font-size:9px;font-weight:700;color:var(--muted,#62736A);font-variant-numeric:tabular-nums\">{{ b.short2 }}<\u002Fdiv>\n                  <div style=\"width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:{{ b.color }};height:{{ b.h }}px;transition:height .4s\"><\u002Fdiv>\n                  <div style=\"font-size:9px;font-weight:600;color:var(--muted,#62736A);writing-mode:vertical-rl;transform:rotate(180deg);height:38px;over le }}\">Per Daerah<\u002Fbutton>\n        <button onclick=\"{{ onLapModeCmp }}\" style=\"{{ lapModeCmpStyle }}\">Perbandingan<\u002Fbutton>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ lapSingle }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n      <!-- statement filter -->\n      <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px\">\n        <sc-for list=\"{{ lapTabs }}\" as=\"t\" hint-placeholder-count=\"6\">\n          <button onclick=\"{{ t.onClick }}\" title=\"{{ t.full }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- statement table -->\n      <div style=\"background:var(--surface,#fff);border:1px solid var(--border,#dce6dd);border-radius:16px;padding:18px 20px;margin-bottom:18px\">\n        <div style=\"margin-bottom:14px\">\n          <h3 style=\"font-size:16px;font-weight:700;font-family:'Lora',serif\">{{ lapStmtTitle }}<\u002Fh3>\n          <p style=\"font-size:12px;color:var(--muted,#62736A);margin-top:3px\">{{ lapStmtSub }}<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"ntb-scroll\" style=\"overflow-x:auto\">\n          <div style=\"min-width:540px\">\n            <div style=\"display:grid;grid-template-columns:{{ lapGrid }};gap:4px 10px;padding:0 12px 9px;border-bottom:1.5px solid var(--border,#dce6dd)\">\n              <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted,#62736A)\">Uraian<\u002Fdiv>\n              <sc-for list=\"{{ lapCols }}\" as=\"c\" hint-placeholder-count=\"4\"><div style=\"font-size:10.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--muted,#62736A);text-align:right\">{{ c.name }}<\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-for list=\"{{ lapRows }}\" as=\"row\" hint-placeholder-count=\"14\">\n              <div style=\"display:grid;grid-template-columns:{{ lapGrid }};gap:4px 10px;align-items:center;padding:8px 12px;border-bottom:1px  as=\"it\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;gap:12px;align-items:flex-start\">\n                  <div style=\"width:3px;align-self:stretch;border-radius:3px;background:{{ it.bar }};flex-shrink:0;min-height:42px\"><\u002Fdiv>\n                  <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:4px\">\n                    <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px\">\n                      <span style=\"font-size:12.5px;font-weight:700;line-height:1.25\">{{ it.label }}<\u002Fspan>\n                      <span style=\"font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;flex-shrink:0\">{{ it.val }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n                      <span style=\"font-size:9px;font-weight:800;letter-spacing:.3px;padding:2px 7px;border-radius:6px;flex-shrink:0;{{ it.pill }}\">{{ it.statusLabel }}<\u002Fspan>\n                      <span style=\"font-size:10.5px;color:var(--muted,#62736A);font-style:italic\">{{ it.formula }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <p style=\"font-size:11.5px;line-height:1.45;color:var(--muted,#62736A)\">{{ it.note }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===== PERBANDINGAN ANTAR DAERAH ===== -->\n      <sc-if value=\"{{ lapCompareOn }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <p style=\"font-size:13.5px;color:var(--muted,#62736A);max-width:680px;margin-bottom:14px\">Pilih jenis laporan dan daerah untuk membandingkan laporan keuangannya berdampingan (maks. 4 daerah).<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px\">\n          <sc-for list=\"{{ lapTabs }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <button onclick=\"{{ t.onClick }}\" title=\"{{ t.full }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px\">\n          <sc-for list=\"{{ lapChips }}\" as=\"c\" hint-placeholder-count=\"10\">\n            <button onclick=\"{{ c.onClick }}\" style=\"{{ c.style }}\">{{ c.name }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface,#fff);border:1px solid var(--border,#dce6dd);border-radius:16px;padding:18px 20px\">\n          <div style=\"margin-bottom:12px\">\n            <h3 style=\"font-size:16px;font-weight:700;font-family:'Lora',serif\">{{ lapStmtTitle }}<\u002Fh3>\n            <p style=\"font-size:12px;color:var(--muted,#62736A);margin-top:3px\">{{ lapCmpBasis }}<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"ntb-scroll\" style=\"overflow-x:auto\">\n            <div style=\"min-width:520px\">\n              <div style=\"display:grid;grid-template-columns:{{ lapCmpGrid }};gap:4px 10px;padding:0 12px 9px;border-bottom:1.5px solid var(--border,#dce6dd)\">\n                <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--muted,#62736A)\">Uraian<\u002Fdiv>\n                <sc-for list=\"{{ lapCmpRegions }}\" as=\"rg\" hint-placeholder-count=\"3\"><div style=\"font-size:11px;font-weight:800;text-align:right;color:{{ rg.color }}\">{{ rg.name }}<\u002Fdiv><\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-for list=\"{{ lapCmpRows }}\" as=\"row\" hint-placeholder-count=\"14\">\n                <div style=\"display:grid;grid-template-columns:{{ lapCmpGrid }};gap:4px 10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border,#dce6dd);background:{{ row.bg }}\">\n                  <div style=\"font-size:12.5px;font-weight:{{ row.weight }};color:{{ row.color }};padding-left:{{ row.pad }}\">{{ row.label }}<\u002Fdiv>\n                  <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"3\">\n                    <div style=\"text-align:right;font-size:12.5px;font-weight:{{ cell.w }};color:{{ cell.color }};font-variant-numeric:tabular-nums\">{{ cell.t }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== RASIO KINERJA ===================== -->\n  <sc-if value=\"{{ isRasio }}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <div style=\"margin-bottom:18px\">\n        <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:7px\">\n          <div style=\"width:6px;height:6px;border-radius:50%;background:var(--gold,#D4AF37)\"><\u002Fdiv>\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold-dark,#7A631A)\">Analisis Rasio Kinerja · {{ yearStr }}<\u002Fspan>\n        <\u002Fdiv>\n        <h1 style=\"font-family:'Lora',serif;font-weight:700;font-size:28px;letter-spacing:-.4px\">Rasio Kinerja Keuangan<\u002Fh1>\n        <p style=\"margin-top:7px;font-size:13.5px;color:var(--muted,#62736A);max-width:620px\">Pilih daerah untuk dibandingkan (maks. 4). Label otomatis menilai tiap rasio terhadap ambang batas standar.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px\">\n        <sc-for list=\"{{ regionChips }}\" as=\"c\" hint-placeholder-count=\"10\">\n          <button onclick=\"{{ c.onClick }}\" style=\"{{ c.style }}\">{{ c.name }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 360px;gap:14px\">\n        <div style=\"background:var(--surface,#fff);border:1px solid var(--border,#dce6dd);border-radius:16px;padding:18px 20px;overflow:auto\" class=\"ntb-scroll\">\n          <h3 style=\"font-size:14.5px;font-weight:700;margin-bottom:12px\">Tabel Perbandingan Rasio<\u002Fh3>\n          <sc-for list=\"{{ ratioCols }}\" as=\"col\" hint-placeholder-count=\"3\"><\u002Fsc-for><sc-for list=\"{{ ratioRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n                <\u002Fsc-for><sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"3\">\n                    <\u002Fsc-for><table style=\"width:100%;border-collapse:collapse;min-width:560px\">\n            <thead><tr>\n              <th style=\"text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--muted,#62736A);padding:0 8px 9px 0\">Rasio<\u002Fth>\n              <th style=\"text-align:center;font-size:11px;font-weight:700;padding:0 4px 9px;color:{{ col.color }}\">{{ col.name }}<\u002Fth>\n            <\u002Ftr><\u002Fthead>\n            <tbody>\n              <tr style=\"border-top:1px solid var(--border,#dce6dd)\">\n                  <td style=\"padding:11px 8px 11px 0;max-width:180px\">\n                    <div style=\"font-size:12.5px;font-weight:700\">{{ row.label }}<\u002Fdiv>\n                    <div style=\"font-size:10.5px;color:var(--muted,#62736A);margin-top:1px\">{{ row.desc }}<\u002Fdiv>\n                  <\u002Ftd>\n                  <td style=\"padding:11px 4px;text-align:center\">\n                      <div style=\"font-size:14px;font-weight:800;font-variant-numeric:tabular-nums\">{{ cell.val }}<\u002Fdiv>\n                      <div style=\"display:inline-block;margin-top:4px;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:6px;{{ cell.pill }}\">{{ cell.label }}<\u002Fdiv>\n                    <\u002Ftd>\n                  \n                <\u002Ftr>\n              \n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n\n        <!-- radar -->\n        <div style=\"background:var(--surface,#fff);border:1px solid var(--border,#dce6dd);border-radius:16px;padding:18px 20px\">\n          <h3 style=\"font-size:14.5px;font-weight:700;margin-bottom:4px\">Profil Rasio (Radar)<\u002Fh3>\n          <svg viewBox=\"0 0 320 300\" style=\"width:100%;height:auto;display:block\">\n            <sc-for list=\"{{ radarRings }}\" as=\"g\" hint-placeholder-count=\"3\"><polygon points=\"{{ g.points }}\" fill=\"none\" stroke=\"var(--border,#dce6dd)\" stroke-width=\"1\"><\u002Fpolygon><\u002Fsc-for>\n            <sc-for list=\"{{ radarAxes }}\" as=\"a\" hint-placeholder-count=\"6\">\n              <line x1=\"160\" y1=\"148\" x2=\"{{ a.x }}\" y2=\"{{ a.y }}\" stroke=\"var(--border,#dce6dd)\" stroke-width=\"1\"><\u002Fline>\n              <text x=\"{{ a.lx }}\" y=\"{{ a.ly }}\" text-anchor=\"{{ a.anchor }}\" font-size=\"9.5\" font-weight=\"700\" fill=\"var(--muted,#62736A)\">{{ a.label }}<\u002Ftext>\n            <\u002Fsc-for>\n            <sc-for list=\"{{ radarShapes }}\" as=\"s\" hint-placeholder-count=\"3\"><polygon points=\"{{ s.points }}\" fill=\"{{ s.fill }}\" stroke=\"{{ s.stroke }}\" stroke-width=\"2\"><\u002Fpolygon><\u002Fsc-for>\n          <\u002Fsvg>\n          <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:10px\">\n            <sc-for list=\"{{ radarLegend }}\" as=\"l\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:11px;height:11px;border-radius:3px;background:{{ l.color }}\"><\u002Fspan><span style=\"font-size:12px;font-weight:600\">{{ l.name }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== REKOMENDASI ===================== -->\n  <sc-if value=\"{{ isRek }}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <div style=\"margin-bottom:16px\">\n        <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:7px\">\n          <div style=\"width:6px;height:6px;border-radius:50%;background:var(--gold,#D4AF37)\"><\u002Fdiv>\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold-dark,#7A631A)\">Berbasis AI · {{ yearStr }}<\u002Fspan>\n        <\u002Fdiv>\n        <h1 style=\"font-family:'Lora',serif;font-weight:700;font-size:28px;letter-spacing:-.4px\">Rekomendasi Pemeriksaan Selanjutnya<\u002Fh1>\n        <p style=\"margin-top:7px;font-size:13.5px;color:var(--muted,#62736A);max-width:640px\">Area fokus audit yang dihasilkan otomatis dari analisis anomali — serapan ekstrem, rasio “Perlu Perhatian”, dan deviasi belanja.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px\">\n        <div style=\"display:flex;gap:4px;padding:4px;border-radius:11px;background:var(--surface,#fff);border:1px solid var(--border,#dce6dd)\">\n          <sc-for list=\"{{ priTabs }}\" as=\"p\" hint-placeholder-count=\"4\"><button onclick=\"{{ p.onClick }}\" style=\"{{ p.style }}\">{{ p.label }}<\u002Fbutton><\u002Fsc-for>\n        <\u002Fdiv>\n        <select value=\"{{ rekRegion }}\" onchange=\"{{ onRekRegion }}\" style=\"height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--border,#dce6dd);background:var(--surface,#fff);color:var(--text,#16271E);font-weight:700;font-size:12.5px;cursor:pointer\">\n          <sc-for list=\"{{ rekRegionOpts }}\" as=\"o\" hint-placeholder-count=\"11\"><option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n        <\u002Fselect>\n        <div style=\"flex:1\"><\u002Fdiv>\n        <div style=\"display:flex;gap:8px\">\n          <sc-for list=\"{{ priCounts }}\" as=\"pc\" hint-placeholder-count=\"3\"><div style=\"display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:9px;background:{{ pc.bg }}\"><span style=\"font-size:16px;font-weight:800;color:{{ pc.fg }};font-variant-numeric:tabular-nums\">{{ pc.n }}<\u002Fspan><span style=\"font-size:11px;font-weight:600;color:{{ pc.fg }}\">{{ pc.label }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:14px\">\n        <sc-for list=\"{{ recCards }}\" as=\"rec\" hint-placeholder-count=\"6\">\n          <div style=\"background:var(--surface,#fff);border:1px solid var(--border,#dce6dd);border-radius:15px;padding:17px 18px;border-left:4px solid {{ rec.accent }};display:flex;flex-direction:column;gap:9px\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n              <span style=\"font-size:11px;font-weight:700;color:var(--muted,#62736A)\">{{ rec.region }}<\u002Fspan>\n              <span style=\"font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:3px 9px;border-radius:7px;{{ rec.pill }}\">{{ rec.priority }}<\u002Fspan>\n            <\u002Fdiv>\n            <h4 style=\"font-size:15px;font-weight:700;line-height:1.3;letter-spacing:-.2px\">{{ rec.title }}<\u002Fh4>\n            <p style=\"font-size:12.5px;line-height:1.5;color:var(--muted,#62736A)\">{{ rec.reason }}<\u002Fp>\n            <button onclick=\"{{ rec.onClick }}\" style=\"align-self:flex-start;margin-top:2px;font-size:11.5px;font-weight:700;color:var(--green,#1B6744);background:none;border:0;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:5px\">{{ rec.refLabel }} <span>→<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ recEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align:center;padding:50px;color:var(--muted,#62736A);font-size:13px\">Tidak ada rekomendasi untuk filter ini.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== ADMIN ===================== -->\n  <sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <!-- gate -->\n      <sc-if value=\"{{ adminLocked }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"max-width:420px;margin:40px auto;background:var(--surface,#fff);border:1px solid var(--border,#dce6dd);border-radius:18px;padding:34px 32px;text-align:center;box-shadow:0 24px 60px -40px rgba(20,40,28,.5)\">\n          <div style=\"width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--green,#1B6744),var(--green2,#289865));margin:0 auto 18px;display:flex;align-items:center;justify-content:center\"><div style=\"width:18px;height:18px;background:var(--gold,#D4AF37);transform:rotate(45deg);border-radius:3px\"><\u002Fdiv><\u002Fdiv>\n          <h2 style=\"font-family:'Lora',serif;font-size:22px;font-weight:700\">Panel Admin<\u002Fh2>\n          <p style=\"font-size:13px;color:var(--muted,#62736A);margin-top:8px;line-height:1.5\">Akses terbatas untuk admin terpercaya. Masuk untuk mengunggah laporan BPK dan memperbarui data.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:22px;text-align:left\">\n            <input placeholder=\"email@bpk.go.id\" style=\"height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--border,#dce6dd);background:var(--surface2,#EAF1EA);font-size:13px;font-family:inherit;color:var(--text,#16271E)\">\n            <input type=\"password\" placeholder=\"••••••••\" style=\"height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--border,#dce6dd);background:var(--surface2,#EAF1EA);font-size:13px;font-family:inherit;color:var(--text,#16271E)\">\n          <\u002Fdiv>\n          <button onclick=\"{{ onLogin }}\" style=\"width:100%;height:46px;margin-top:16px;border-radius:11px;border:0;background:linear-gradient(135deg,var(--green,#1B6744),var(--green2,#289865));color:#fff;font-weight:700;font-size:14px;cursor:pointer\">Masuk dengan InsForge Auth<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ adminUnlocked }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px\">\n            <div>\n              <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:7px\">\n                <span style=\"width:7px;height:7px;border-radius:50%;background:var(--green2,#289865);animation:ntbpulse 1.8s infinite\"><\u002Fspan>\n                <span style=\"font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--green,#1B6744)\">Terhubung · InsForge<\u002Fspan>\n              <\u002Fdiv>\n              <h1 style=\"font-family:'Lora',serif;font-weight:700;font-size:26px\">Unggah Laporan BPK<\u002Fh1>\n            <\u002Fdiv>\n            <button onclick=\"{{ onLogout }}\" style=\"height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--border,#dce6dd);background:var(--surface,#fff);color:var(--muted,#62736A);font-weight:700;font-size:12.5px;cursor:pointer\">Keluar<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n            <div style=\"background:var(--surface,#fff);border:1px solid var(--border,#dce6dd);border-radius:16px;padding:20px\">\n              <h3 style=\"font-size:14.5px;font-weight:700;margin-bottom:14px\">Impor Data Baru<\u002Fh3>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px\">\n                <div><label style=\"font-size:11px;font-weight:600;color:var(--muted,#62736A);display:block;margin-bottom:5px\">Tahun Anggaran<\u002Flabel>\n                  <select style=\"width:100%;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--border,#dce6dd);background:var(--surface2,#EAF1EA);font-weight:600;font-size:13px;color:var(--text,#16271E)\"><option>2025<\u002Foption><option>2024<\u002Foption><option>2023<\u002Foption><\u002Fselect><\u002Fdiv>\n                <div><label style=\"font-size:11px;font-weight:600;color:var(--muted,#62736A);display:block;margin-bottom:5px\">Daerah<\u002Flabel>\n                  <select style=\"width:100%;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--border,#dce6dd);background:var(--surface2,#EAF1EA);font-weight:600;font-size:13px;color:var(--text,#16271E)\"><option>Kota Mataram<\u002Foption><option>Kab. Lombok Barat<\u002Foption><option>Provinsi NTB<\u002Foption><\u002Fselect><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:2px dashed var(--border,#cbdccf);border-radius:13px;padding:26px;text-align:center;background:var(--surface2,#EAF1EA)\">\n                <div style=\"font-size:26px;margin-bottom:6px\">⬆<\u002Fdiv>\n                <div style=\"font-size:13px;font-weight:700\">Seret file CSV / Excel ke sini<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--muted,#62736A);margin-top:3px\">{{ uploadName }}<\u002Fdiv>\n                <button onclick=\"{{ onPickFile }}\" style=\"margin-top:12px;height:36px;padding:0 16px;border-radius:9px;border:1px solid var(--border,#dce6dd);background:var(--surface,#fff);font-weight:700;font-size:12.5px;cursor:pointer;color:var(--text,#16271E)\">Pilih File<\u002Fbutton>\n              <\u002Fdiv>\n              <button onclick=\"{{ onImport }}\" style=\"{{ importBtnStyle }}\">{{ importLabel }}<\u002Fbutton>\n              <sc-if value=\"{{ importing }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:14px\">\n                  <sc-for list=\"{{ importSteps }}\" as=\"s\" hint-placeholder-count=\"4\">\n                    <div style=\"display:flex;align-items:center;gap:9px;padding:6px 0\">\n                      <span style=\"width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;{{ s.dot }}\">{{ s.icon }}<\u002Fspan>\n                      <span style=\"font-size:12.5px;font-weight:600;color:{{ s.color }}\">{{ s.label }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ importDone }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:14px;padding:13px 15px;border-radius:12px;background:rgba(40,152,101,.12);border:1px solid rgba(40,152,101,.3)\">\n                  <div style=\"font-size:13px;font-weight:700;color:var(--green,#1B6744)\">✓ Impor berhasil<\u002Fdiv>\n                  <div style=\"font-size:12px;color:var(--muted,#62736A);margin-top:3px\">Data tersimpan, ringkasan &amp; rasio diperbarui. <strong style=\"color:var(--gold-dark,#7A631A)\">{{ newRecCount }} rekomendasi baru<\u002Fstrong> dibuat via OpenRouter API.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <div style=\"background:var(--surface,#fff);border:1px solid var(--border,#dce6dd);border-radius:16px;padding:20px\">\n              <h3 style=\"font-size:14.5px;font-weight:700;margin-bottom:14px\">Riwayat Unggahan<\u002Fh3>\n              <div style=\"display:flex;flex-direction:column\">\n                <div style=\"display:grid;grid-template-columns:1fr 70px 86px;gap:8px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted,#62736A);padding-bottom:9px;border-bottom:1px solid var(--border,#dce6dd)\"><div>Daerah / Tahun<\u002Fdiv><div style=\"text-align:center\">Status<\u002Fdiv><div style=\"text-align:right\">Waktu<\u002Fdiv><\u002Fdiv>\n                <sc-for list=\"{{ uploadHistory }}\" as=\"u\" hint-placeholder-count=\"5\">\n                  <div style=\"display:grid;grid-template-columns:1fr 70px 86px;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border,#dce6dd)\">\n                    <div><div style=\"font-size:12.5px;font-weight:600\">{{ u.region }}<\u002Fdiv><div style=\"font-size:11px;color:var(--muted,#62736A)\">TA {{ u.year }}<\u002Fdiv><\u002Fdiv>\n                    <div style=\"text-align:center\"><span style=\"font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;{{ u.statusPill }}\">{{ u.status }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"text-align:right;font-size:11px;color:var(--muted,#62736A)\">{{ u.time }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <footer style=\"border-top:1px solid var(--border,#dce6dd);background:var(--surface,#fff)\">\n    <div style=\"padding:18px 26px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center\">\n      <div style=\"font-size:11.5px;color:var(--muted,#62736A)\">Sumber: laporan APBD yang telah diaudit BPK · Data ilustratif (dummy) untuk pratinjau · Pemerintah Provinsi NTB<\u002Fdiv>\n      <div style=\"font-size:11px;color:var(--muted,#62736A);font-weight:600\">Dibuat dengan palet hijau-emas NTB<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;defaultDark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;accentStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;emas&quot;,&quot;hijau&quot;],&quot;default&quot;:&quot;emas&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;homeLayout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;peta&quot;,&quot;grid&quot;],&quot;default&quot;:&quot;peta&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    view: 'beranda', year: 2024, dark: null, unit: 'miliar',\n    region: 'mataram', metric: 'pendapatan', homeLayout: null,\n    hover: null, compare: ['mataram','loteng','sumbawa'],\n    rekPri: 'semua', rekRegion: 'semua', laporanTab: 'LRA', lapMode: 'single', lapCompare: ['mataram','loteng','sumbawa'],\n    mapLevel: 'indonesia', mapHover: null, trendMetric: 'pendapatan',\n    authed: false, importing: false, importDone: false, uploadName: 'Belum ada file dipilih',\n  };\n\n  // ---------- theme ----------\n  componentDidMount(){\n    if(typeof window!=='undefined' && !window.NTB_MAP){\n      this._mapTimer=setInterval(()=>{ if(window.NTB_MAP){ clearInterval(this._mapTimer); this.forceUpdate(); } }, 120);\n    }\n  }\n  componentWillUnmount(){ if(this._mapTimer) clearInterval(this._mapTimer); }\n  getDark(){ return this.state.dark===null ? !!this.props.defaultDark : this.state.dark; }\n  getHomeLayout(){ return this.state.homeLayout===null ? (this.props.homeLayout || 'peta') : this.state.homeLayout; }\n  accentCol(){ return (this.props.accentStyle==='hijau') ? '#1B6744' : '#D4AF37'; }\n  themeVars(){\n    const a = this.accentCol();\n    if(this.getDark()){\n      return \"--bg:#0D1611;--surface:#15231C;--surface2:#1B2C23;--border:#27392F;--text:#E9F1EB;--muted:#90A597;--green:#3FB47C;--green2:#5BC892;--greenSoft:#1F3A2C;--gold:#E5C254;--gold-dark:#D7B547;--goldSoft:#33301C;--headbg:rgba(13,22,17,.82);--mapsea:#0E1B24;--mapland:#243A2E;--accent:\"+a+\";\";\n    }\n    return \"--bg:#F1F5F0;--surface:#FFFFFF;--surface2:#EAF1EA;--border:#DCE6DD;--text:#16271E;--muted:#62736A;--green:#1B6744;--green2:#289865;--greenSoft:#B0D4BF;--gold:#D4AF37;--gold-dark:#7A631A;--goldSoft:#E9D69B;--headbg:rgba(241,245,240,.85);--mapsea:#DCE9F2;--mapland:#C2D6C6;--accent:\"+a+\";\";\n  }\n\n  // ---------- data ----------\n  regionsList(){\n    return [\n      {id:'prov',name:'Provinsi NTB',short:'Prov. NTB',type:'province'},\n      {id:'mataram',name:'Kota Mataram',short:'KOMAT',type:'city',pos:{x:3,y:40,w:12,h:15}},\n      {id:'klu',name:'Kab. Lombok Utara',short:'KLU',type:'regency',pos:{x:15,y:9,w:18,h:24}},\n      {id:'lobar',name:'Kab. Lombok Barat',short:'LOBAR',type:'regency',pos:{x:15,y:35,w:13,h:25}},\n      {id:'loteng',name:'Kab. Lombok Tengah',short:'LOTENG',type:'regency',pos:{x:17,y:62,w:16,h:22}},\n      {id:'lotim',name:'Kab. Lombok Timur',short:'LOTIM',type:'regency',pos:{x:33,y:33,w:14,h:35}},\n      {id:'ksb',name:'Kab. Sumbawa Barat',short:'KSB',type:'regency',pos:{x:52,y:42,w:10,h:24}},\n      {id:'sumbawa',name:'Kab. Sumbawa',short:'SUMBAWA',type:'regency',pos:{x:62,y:21,w:18,h:39}},\n      {id:'dompu',name:'Kab. Dompu',short:'DOMPU',type:'regency',pos:{x:78,y:48,w:10,h:24}},\n      {id:'bima',name:'Kab. Bima',short:'KABI',type:'regency',pos:{x:83,y:25,w:13,h:31}},\n      {id:'kobi',name:'Kota Bima',short:'KOBI',type:'city',pos:{x:90,y:62,w:8,h:12}},\n    ];\n  }\n  regionById(id){ return this.regionsList().find(r=>r.id===id) || this.regionsList()[0]; }\n  base(){ return {prov:5800,mataram:1750,klu:1150,lobar:2050,loteng:2600,lotim:3100,ksb:1450,sumbawa:2200,dompu:1350,bima:2000,kobi:980}; }\n  hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0)/4294967295; }\n\n  fin(rid,year){\n    const b=this.base()[rid]||1000;\n    const g=Math.pow(1.062,year-2021);\n    const plannedRev=Math.round(b*g*(0.96+this.hash(rid+year+'r')*0.09));\n    const serapan=0.80+this.hash(rid+year+'s')*0.185;\n    const realizedRev=Math.round(plannedRev*serapan);\n    const padShare = rid==='prov'?0.56 : rid==='mataram'?0.31 : rid==='kobi'?0.17 : 0.09+this.hash(rid+'p')*0.13;\n    const padPlanned=Math.round(plannedRev*padShare);\n    const padEff=0.83+this.hash(rid+year+'e')*0.26;\n    const padRealized=Math.round(padPlanned*padEff);\n    const transfer=plannedRev-padPlanned;\n    const transferReal=realizedRev-padRealized;\n    const plannedExp=Math.round(plannedRev*(1.0+(this.hash(rid+year+'x')-0.5)*0.07));\n    const expSer=0.79+this.hash(rid+year+'xs')*0.19;\n    const realizedExp=Math.round(plannedExp*expSer);\n    const financing=realizedExp-realizedRev;\n    let pegawai=0.33+this.hash(rid+'pg')*0.11;\n    let modal=0.13+this.hash(rid+year+'md')*0.13;\n    let barang=0.21+this.hash(rid+'br')*0.07;\n    let lain=Math.max(0.08,1-pegawai-modal-barang);\n    const sum=pegawai+modal+barang+lain; pegawai/=sum;modal/=sum;barang/=sum;lain/=sum;\n    return {plannedRev,realizedRev,serapan,padPlanned,padRealized,transfer,transferReal,plannedExp,realizedExp,expSer,financing,padEff,bd:{pegawai,barang,modal,lain}};\n  }\n  ratios(rid,year){\n    const f=this.fin(rid,year);\n    return {\n      ddf: f.padRealized/f.realizedRev*100,\n      rkk: f.padRealized/f.transferReal*100,\n      efektivitas: f.padRealized/f.padPlanned*100,\n      efisiensi: f.realizedExp/f.realizedRev*100,\n      bmodal: f.bd.modal*100,\n      ketergantungan: f.transfer/f.plannedRev*100,\n    };\n  }\n  ratioCfg(){ return {\n    ddf:{dir:1,mid:25,good:40,label:'Derajat Desentralisasi Fiskal',desc:'PAD / Total Pendapatan'},\n    rkk:{dir:1,mid:50,good:75,label:'Rasio Kemandirian',desc:'PAD / Dana Transfer'},\n    efektivitas:{dir:1,mid:90,good:100,label:'Efektivitas PAD',desc:'Realisasi / Target PAD'},\n    efisiensi:{dir:-1,mid:100,good:90,label:'Efisiensi Belanja',desc:'Belanja / Pendapatan'},\n    bmodal:{dir:1,mid:15,good:25,label:'Belanja Modal / Total',desc:'Porsi belanja modal'},\n    ketergantungan:{dir:-1,mid:70,good:50,label:'Ketergantungan',desc:'Transfer / Pendapatan'},\n  };}\n  statusFor(key,val){\n    const c=this.ratioCfg()[key]; let label;\n    if(c.dir>0) label = val>=c.good?'Baik':val>=c.mid?'Cukup':'Perlu Perhatian';\n    else label = val<=c.good?'Baik':val<=c.mid?'Cukup':'Perlu Perhatian';\n    const tone = label==='Baik'?'good':label==='Cukup'?'mid':'bad';\n    return {label,tone};\n  }\n  tonePill(tone){\n    if(tone==='good') return 'background:rgba(40,152,101,.15);color:var(--green2,#289865)';\n    if(tone==='mid') return 'background:rgba(212,175,55,.18);color:var(--gold-dark,#7A631A)';\n    return 'background:rgba(194,75,51,.15);color:#C24B33';\n  }\n  toneColor(tone){ return tone==='good'?'var(--green2,#289865)':tone==='mid'?'var(--gold-dark,#7A631A)':'#C24B33'; }\n\n  recsFor(rid,year){\n    const f=this.fin(rid,year), r=this.ratios(rid,year), name=this.regionById(rid).name, out=[];\n    const p=(x)=>this.fmtPct(x);\n    if(f.serapan<0.865) out.push({title:'Serapan belanja rendah pada akhir tahun',reason:'Serapan anggaran hanya '+p(f.serapan*100)+' hingga akhir tahun anggaran — indikasi keterlambatan kontrak atau proses pengadaan. Perlu ditelusuri pada belanja modal.',priority:'Tinggi',ref:'serapan',refLabel:'Lihat peta serapan'});\n    if(f.expSer>0.975) out.push({title:'Lonjakan realisasi belanja triwulan IV',reason:'Realisasi belanja mencapai '+p(f.expSer*100)+' namun terkonsentrasi di akhir tahun. Periksa kualitas pertanggungjawaban dan kewajaran penyerapan.',priority:'Tinggi',ref:'detail',refLabel:'Buka detail daerah'});\n    if(r.efektivitas<92) out.push({title:'Target PAD tidak tercapai',reason:'Efektivitas PAD '+p(r.efektivitas)+' di bawah ambang batas. Potensi over-estimasi target atau kebocoran penerimaan asli daerah.',priority:'Sedang',ref:'rasio',refLabel:'Lihat rasio kinerja'});\n    if(r.ketergantungan>68) out.push({title:'Ketergantungan dana transfer tinggi',reason:p(r.ketergantungan)+' pendapatan berasal dari dana transfer pusat. Kemandirian fiskal lemah — telaah strategi optimalisasi PAD.',priority:'Sedang',ref:'rasio',refLabel:'Lihat rasio kinerja'});\n    if(f.bd.modal<0.16) out.push({title:'Porsi belanja modal relatif kecil',reason:'Belanja modal hanya '+p(f.bd.modal*100)+' dari total belanja. Periksa prioritas pembangunan dan komposisi belanja pegawai.',priority:'Rendah',ref:'detail',refLabel:'Lihat komposisi belanja'});\n    if(out.length<2) out.push({title:'Profil keuangan dalam batas wajar',reason:'Tidak ditemukan anomali signifikan pada tahun anggaran ini. Tetap pantau realisasi triwulanan sebagai kontrol rutin.',priority:'Rendah',ref:'detail',refLabel:'Buka detail daerah'});\n    return out.map((o,i)=>({...o,id:rid+year+i,region:name,rid}));\n  }\n\n  // ---------- format ----------\n  fmt(v){\n    if(this.state.unit==='triliun') return 'Rp '+(v/1000).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+' T';\n    return 'Rp '+Math.round(v).toLocaleString('id-ID')+' M';\n  }\n  fmtShort(v){\n    if(this.state.unit==='triliun') return (v/1000).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+'T';\n    return Math.round(v).toLocaleString('id-ID');\n  }\n  fmtPct(x){ return x.toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'; }\n\n  // ---------- chart builders ----------\n  buildLine(vals,W,H){\n    const pl=44,pr=10,pt=26,pb=34;\n    const min=Math.min(...vals)*0.92, max=Math.max(...vals)*1.04, rng=(max-min)||1;\n    const n=vals.length;\n    const pts=vals.map((v,i)=>{\n      const x=pl+(W-pl-pr)*(n===1?0.5:i/(n-1));\n      const y=pt+(H-pt-pb)*(1-(v-min)/rng);\n      return {x:+x.toFixed(1),y:+y.toFixed(1),v};\n    });\n    const poly=pts.map(p=>p.x+','+p.y).join(' ');\n    const area='M'+pts[0].x+','+pts[0].y+' '+pts.map(p=>'L'+p.x+','+p.y).join(' ')+' L'+pts[n-1].x+','+(H-pb)+' L'+pts[0].x+','+(H-pb)+' Z';\n    return {pts,poly,area,top:pt,bot:H-pb};\n  }\n\n  // ---------- actions ----------\n  exportCSV(){\n    const year=this.state.year, regs=this.regionsList();\n    let csv='Daerah,Pendapatan Realisasi,Belanja Realisasi,Serapan %,DDF,Kemandirian,Efektivitas PAD,Ketergantungan\\n';\n    regs.forEach(r=>{ const f=this.fin(r.id,year),rt=this.ratios(r.id,year);\n      csv+=[r.name,Math.round(f.realizedRev),Math.round(f.realizedExp),(f.serapan*100).toFixed(1),rt.ddf.toFixed(1),rt.rkk.toFixed(1),rt.efektivitas.toFixed(1),rt.ketergantungan.toFixed(1)].join(',')+'\\n';\n    });\n    try{\n      const blob=new Blob([ =f.realizedRev;\n    const TotalBelanja=f.realizedExp, BelModal=f.realizedExp*f.bd.modal, BelPegawai=f.realizedExp*f.bd.pegawai;\n    const TotalAset=TotalPend*(1.2+h('am')*0.75);\n    const kwjRatio=0.006+h('kw')*0.05;\n    const TotalKwj=TotalAset*kwjRatio, KwjJP=TotalKwj*(0.9+h('jp')*0.1), Ekuitas=TotalAset-TotalKwj;\n    const AsetLancar=KwjJP*(1.7+h('cr')*7.5), Persediaan=AsetLancar*(0.06+h('ps')*0.16), Kas=KwjJP*(0.4+h('ks')*3.4);\n    const PendLO=TotalPend*(0.93+h('plo')*0.07), BebanLO=PendLO*(0.92+h('opr')*0.13);\n    const fprev=this.fin(rid,Math.max(2021,year-1)), PendLOprev=fprev.realizedRev*(0.93+this.hash(rid+(year-1)+'plo')*0.07);\n    const EkuitasAwal=Ekuitas/(1.0+(h('eg')*0.055-0.005));\n    return {PAD,PADtarget,Transfer,TotalPend,TotalBelanja,BelModal,BelPegawai,Kas,AsetLancar,Persediaan,KwjJP,TotalAset,TotalKwj,Ekuitas,PendLO,BebanLO,PendLOprev,EkuitasAwal};\n  }\n  statusByDir(val,dir,cukup,baik){ let lab; if(dir>0) lab=val>=baik?'Baik':val>=cukup?'Cukup':'Perlu Perhatian'; else lab=val<=baik?'Baik':val<=cukup?'Cukup':'Perlu Perhatian'; return {label:lab,tone:lab==='Baik'?'good':lab==='Cukup'?'mid':'bad'}; }\n  lapRatioDefs(){ return [\n    {key:'lancar',cat:'Likuiditas',name:'Rasio Lancar',formula:'Aset Lancar ÷ Kewajiban JP',unit:'x',dir:1,cukup:1,baik:2,note:'Aset lancar memadai menutup kewajiban jangka pendek.',calc:D=>D.AsetLancar/D.KwjJP},\n    {key:'kas',cat:'Likuiditas',name:'Rasio Kas',formula:'Kas ÷ Kewajiban JP',unit:'x',dir:1,cukup:0.5,baik:1,note:'Ketersediaan kas untuk kewajiban segera.',calc:D=>D.Kas/D.KwjJP},\n    {key:'cepat',cat:'Likuiditas',name:'Rasio Cepat',formula:'(Aset Lancar − Persediaan) ÷ Kewajiban JP',unit:'x',dir:1,cukup:1,baik:1.5,note:'Likuiditas tanpa mengandalkan persediaan.',calc:D=>(D.AsetLancar-D.Persediaan)/D.KwjJP},\n    {key:'solv',cat:'Solvabilitas',name:'Rasio Solvabilitas',formula:'Total Aset ÷ Total Kewajiban',unit:'x',dir:1,cukup:1.5,baik:2,note:'Kemampuan aset menutup seluruh kewajiban.',calc:D=>D.TotalAset/D.TotalKwj},\n    {key:'der',cat:'Solvabilitas',name:'Kewajiban thd Ekuitas',formula:'Total Kewajiban ÷ Ekuitas',unit:'%',dir:-1,cukup:100,baik:50,note:'Tingkat leverage terhadap ekuitas.',calc:D=>D.TotalKwj/D.Ekuitas*100},\n    {key:'kwjaset',cat:'Solvabilitas',name:'Kewajiban thd Aset',formula:'Total Kewajiban ÷ Total Aset',unit:'%',dir:-1,cukup:50,baik:30,note:'Porsi aset yang dibiayai utang.',calc:D=>D.TotalKwj/D.TotalAset*100},\n    {key:'ddf',cat:'Kemandirian Fiskal',name:'Derajat Desentralisasi Fiskal',formula:'PAD ÷ Total Pendapatan',unit:'%',dir:1,cukup:25,baik:40,note:'Kontribusi PAD terhadap pendapatan.',calc:D=>D.PAD/D.TotalPend*100},\n    {key:'mandiri',cat:'Kemandirian Fiskal',name:'Rasio Kemandirian',formula:'PAD ÷ Pendapatan Transfer',unit:'%',dir:1,cukup:50,baik:75,note:'Kemandirian terhadap dana transfer.',calc:D=>D.PAD/D.Transfer*100},\n    {key:'tergantung',cat:'Kemandirian Fiskal',name:'Rasio Ketergantungan',formula:'Transfer ÷ Total Pendapatan',unit:'%',dir:-1,cukup:70,baik:50,note:'Ketergantungan pada dana transfer.',calc:D=>D.Transfer/D.TotalPend*100},\n    {key:'efekpad',cat:'Efisiensi & Belanja',name:'Efektivitas PAD',formula:'Realisasi ÷ Target PAD',unit:'%',dir:1,cukup:90,baik:100,note:'Capaian realisasi terhadap target PAD.',calc:D=>D.PAD/D.PADtarget*100},\n    {key:'efisiensi',cat:'Efisiensi & Belanja',name:'Efisiensi Belanja',formula:'Belanja ÷ Pendapatan',unit:'%',dir:-1,cukup:100,baik:90,note:'Belanja relatif terhadap pendapatan.',calc:D=>D.TotalBelanja/D.TotalPend*100},\n    {key:'belmodal',cat:'Efisiensi & Belanja',name:'Rasio Belanja Modal',formula:'Belanja Modal ÷ Total Belanja',unit:'%',dir:1,cukup:15,baik:25,note:'Porsi belanja modal/pembangunan.',calc:D=>D.BelModal/D.TotalBelanja*100},\n    {key:'belpeg',cat:'Efisiensi & Belanja',name:'Rasio Belanja Pegawai',formula:'Belanja Pegawai ÷ Total Belanja',unit:'%',dir:-1,cukup:50,baik:40,note:'Beban belanja pegawai terhadap total.',calc:D=>D.BelPegawai/D.TotalBelanja*100},\n    {key:'operasi',cat:'Kinerja Operasional (LO)',name:'Rasio Operasi',formula:'Beban-LO ÷ Pendapatan-LO',unit:'%',dir:-1,cukup:100,baik:95,note:'Efisiensi operasional (surplus/defisit-LO).',calc:D=>D.BebanLO/D.PendLO*100},\n    {key:'tumbuhpend',cat:'Kinerja Operasional (LO)',name:'Pertumbuhan Pendapatan-LO',formula:'Δ Pendapatan-LO thd th lalu',unit:'%',dir:1,cukup:0,baik:5,note:'Tren pertumbuhan pendapatan operasional.',calc:D=>(D.PendLO-D.PendLOprev)/D.PendLOprev*100},\n    {key:'tumbuhek',cat:'Kinerja Operasional (LO)',name:'Pertumbuhan Ekuitas',formula:'Δ Ekuitas thd awal tahun',unit:'%',dir:1,cukup:0,baik:3,note:'Perubahan kekayaan bersih daerah.',calc:D=>(D.Ekuitas-D.EkuitasAwal)/D.EkuitasAwal*100},\n  ]; }\n  fmtRatio(v,unit){ return unit==='x' ? v.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+'×' : this.fmtPct(v); }\n  lapRatios(rid,year){\n    const D=this.lapDrivers(rid,year), cats=[], byCat={};\n    this.lapRatioDefs().forEach(d=>{\n      const v=d.calc(D), st=this.statusByDir(v,d.dir,d.cukup,d.baik);\n      if(!byCat[d.cat]){ byCat[d.cat]={name:d.cat,items:[]}; cats.push(byCat[d.cat]); }\n      byCat[d.cat].items.push({label:d.name,val:this.fmtRatio(v,d.unit),formula:d.formula,note:d.note,st,raw:v,key:d.key});\n    });\n    return cats;\n  }\n\n  renderVals(){\n    const S=this.state, year=S.year, dark=this.getDark(), layout=this.getHomeLayout();\n    const regions=this.regionsList(), kab=regions.filter(r=>r.id!=='prov');\n    const set=(o)=>this.setState(o);\n\n    const views=[{id:'beranda',label:'Beranda'},{id:'detail',label:'Detail Daerah'},{id:'laporan',label:'Laporan Keuangan'},{id:'rasio',label:'Rasio Keuangan'},{id:'rekomendasi',label:'Rekomendasi'},{id:'admin',label:'Admin'}];\n    const navItems=views.map(v=>{const on=S.view===v.id;return {label:v.label,btnStyle:this.navStyle(on),dot:on?'rgba(255,255,255,.85)':'var(--border,#dce6dd)',onClick:()=>set({view:v.id})};});\n    const crumbMap={beranda:'Ringkasan Provinsi  // rows\n      out.lapRows=stmt.rows.map(row=>{\n        const bold=row.k==='t', sub=row.k==='s';\n        const cells=row.cols||stmt.cols.map((c,ci)=>{\n          if(stmt.pctCol===ci){ // percent column for LRA\n            const a=row.v[0], r=row.v[1]; let txt;\n            if(typeof row.v[2]==='string') txt=row.v[2];\n            else if(a&&a!==0) txt=this.fmtPct(r/a*100); else txt='–';\n            return {t:txt,color:'var(--muted,#62736A)',w:'600'};\n          }\n          if(stmt.growthCol){\n            // cols: 0=2025,1=2024,2=change,3=%\n            if(ci===2){ const ch=row.v[0]-row.v[1]; return {t:this.fmtAmt(ch*f),color:ch<0?'#C24B33':'inherit',w:'600'}; }\n            if(ci===3){ const ch=row.v[0]-row.v[1]; const p=row.v[1]!==0?ch/Math.abs(row.v[1])*100:null; return {t:p===null?'–':this.fmtPct(p),color:p<0?'#C24B33':'var(--muted,#62736A)',w:'600'}; }\n            const val=row.v[ci]; return {t:val===null?'':this.fmtAmt(val*f),color:val<0?'#C24B33':'inherit',w:bold?'800':'600'};\n          }\n          const val=row.v[ci]; return {t:val===null?'':this.fmtAmt(val*f),color:val<0?'#C24B33':'inherit',w:bold?'800':'600'};\n        });\n        return {label:row.l, pad:(row.lv*15)+'px', weight:bold?'800':sub?'700':'500',\n          bg:bold?'var(--surface2,#EAF1EA)':'transparent',\n          color:bold?'var(--text,#16271E)':sub?'var(--text,#16271E)':'var(--muted,#62736A)',\n          cells};\n      });\n      out.lapRatioCats=this.lapRatios(S.region,year).map(cat=>({name:cat.name, items:cat.items.map(it=>({label:it.label,val:it.val,formula:it.formula,note:it.note,statusLabel:it.st.label,pill:this.tonePill(it.st.tone),bar:this.toneColor(it.st.tone)}))}));\n\n      // mode toggle: per-daerah vs perbandingan\n      const lapMode=S.lapMode||'single';\n      out.lapSingle=lapMode==='single'; out.lapCompareOn=lapMode==='compare';\n      out.lapModePerStyle=this.pillTab(lapMode==='single'); out.lapModeCmpStyle=this.pillTab(lapMode==='compare');\n      out.onLapModePer pNtb=()=>set({mapLevel:'ntb',mapHover:null});\n    out.mapHasHover=false; out.mapHoverName=''; out.mapHoverSub='';\n    if(MD){\n      // Indonesia level\n      out.idnViewBox=MD.indonesia.viewBox; out.idnMarkerX=MD.indonesia.ntbMarker[0]; out.idnMarkerY=MD.indonesia.ntbMarker[1];\n      out.idnProvinces=MD.indonesia.provinces.map(p=>{\n        const hov=p.isNTB && S.mapHover==='__ntbprov';\n        const fill=p.isNTB ? (hov?'var(--green2,#289865)':'var(--gold,#D4AF37)') : 'var(--mapland,#C2D6C6)';\n        return {path:p.path, fill, stroke:'var(--surface,#fff)', sw:p.isNTB?1:0.5,\n          style:'transition:fill .15s;'+(p.isNTB?'cursor:pointer':'pointer-events:none'),\n          onClick:p.isNTB?(()=>set({mapLevel:'ntb',mapHover:null})):null,\n          onEnter:p.isNTB?(()=>set({mapHover:'__ntbprov'})):null,\n          onLeave:p.isNTB?(()=>set({mapHover:null})):null};\n      });\n      if(S.mapHover==='__ntbprov'){ out.mapHasHover=true; out.mapHoverName='Nusa Tenggara Barat'; out.mapHoverSub='Klik untuk menelusuri 10 kab/kota'; }\n      // NTB level\n      out.ntbViewBox=MD.ntb.viewBox;\n      const nameById={}; this.regionsList().forEach(r=>nameById[r.id]=r);\n      out.ntbRegions=MD.ntb.regions.map(rg=>{\n        const f=this.fin(rg.id,year); const tt=Math.max(0,Math.min(1,(f.serapan-0.80)/0.185));\n        const fill='hsl(152 '+(36+tt*30)+'% '+(84-tt*54)+'%)';\n        const sel=S.region===rg.id, hov=S.mapHover===rg.id;\n        return {path:rg.path, fill, sw:sel?2.4:hov?2:0.8,\n          stroke:sel?'var(--gold,#D4AF37)':hov?'var(--gold,#D4AF37)':'var(--surface,#fff)',\n          style:'cursor:pointer;transition:fill .15s,stroke .15s;'+((sel||hov)?'filter:brightness(1.07)':''),\n          onClick:()=>set({region:rg.id,view:'detail'}),\n          onEnter:()=>set({mapHover:rg.id}), onLeave:()=>set({mapHover:null})};\n      });\n      out.ntbLabels=MD.ntb.regions.map(rg=>{\n        const f=this.fin(rg.id,year); const tt=Math.max(0,Math.min(1,(f.serapan-0.80)/0.185));\n        const r=nameById[rg.id]; const small=(rg.id==='mataram'||rg.id==='kobi');\n        return {x:rg.cx, y:rg.cy, short:r?r.short:rg.kabkot, size:small?7.5:9.5, color:tt>0.5?'#fff':'#163A26'};\n      });\n      if(level==='ntb' && S.mapHover && nameById[S.mapHover]){ const f=this.fin(S.mapHover,year); out.mapHasHover=true; out.mapHoverName=nameById[S.mapHover].name; out.mapHoverSub='Serapan '+this.fmtPct(f.serapan*100)+' · klik untuk detail'; }\n    } else {\n      out.idnViewBox='0 0 1000 385'; out.idnProvinces=[]; out.idnMarkerX=500; out.idnMarkerY=320;\n      out.ntbViewBox='0 0 760 251'; out.ntbRegions=[]; out.ntbLabels=[];\n    }\n\n\n    // comparison bars\n    const metrics=[{id:'pendapatan',label:'Pendapatan'},{id:'belanja',label:'Belanja'},{id:'pembiayaan',label:'Pembiayaan'}];\n    out.metricTabs=metrics.map(m=>({label:m.label,style:this.segTab(S.metric===m.id),onClick:()=>set({metric:m.id})}));\n    const mval=(f)=>S.metric==='pendapatan'?f.realizedRev:S.metric==='belanja'?f.realizedExp:Math.abs(f.financing);\n    const barData=kab.map(r=>({r,f:this.fin(r.id,year)}));\n    const maxBar=Math.max(...barData.map(d=>mval(d.f)))||1;\n    out.bars=barData.map(d=>({short:d.r.short,short2:'',color:S.region===d.r.id?'var(--gold,#D4AF37)':'var(--green2,#289865)',h:Math.round(mval(d.f)/maxBar*150),title:d.r.name+' · '+this.fmt(mval(d.f)),onClick:()=>set({region:d.r.id,view:'detail'})}));\n\n    // ranking by serapan (kartu di bawah peta)\n    const ranked=[...kab].map(r=>({r,f:this.fin(r.id,year)})).sort((a,b)=>b.f.serapan-a.f.serapan);\n    out.ranking=ranked.map((d,i)=>({rank:i+1,name:d.r.name,ser:this.fmtPct(d.f.serapan*100),w:Math.round((d.f.serapan-0.78)/0.21*100),onClick:()=>set({region:d.r.id,view:'detail'})}));\n\n    // ranking by selected metric (mengikuti Perbandingan Antar Daerah)\n    const metricLabel={pendapatan:'Pendapatan',belanja:'Belanja',pembiayaan:'Pembiayaan'}[S.metric]||'Pendapatan';\n    out.rankMetricTitle='Peringkat '+metricLabel;\n    const rankedM=[...kab].map(r=>({r,f:this.fin(r.id,year)})).sort((a,b)=>mval(b.f)-mval(a.f));\n    const maxM=Math.max(...rankedM.map(d=>mval(d.f)))||1;\n    out.rankingMetric=rankedM.map((d,i)=>({rank:i+1,name:d.r.name,val:this.fmtShort(mval(d.f)),w:Math.round(mval(d.f)/maxM*100),onClick:()=>set({region:d.r.id,view:'detail'})}));\n\n    // province trend (metrik bisa diganti: pendapatan/belanja/pembiayaan)\n    const tMetric=S.trendMetric||'pendapatan';\n    const tLabel={pendapatan:'Pendapatan',belanja:'Belanja',pembiayaan:'Pembiayaan'}[tMetric];\n    const tval=(f)=>tMetric==='pendapatan'?f.realizedRev:tMetric==='belanja'?f.realizedExp:Math.abs(f.financing);\n    out.trendTabs=metrics.map(m=>({label:m.label,style:this.segTab(tMetric===m.id),onClick:()=>set({trendMetric:m.id})}));\n    out.trendTitle='Tren Realisasi '+tLabel+' Provinsi';\n    out.trendSub='2021–2025 · '+(tMetric==='pembiayaan'?'pembiayaan neto':'realisasi '+tLabel.toLowerCase())+' daerah';\n    const yrs=[2021,2022,2023,2024,2025];\n    const provVals=yrs.map(y=>tval(this.fin('prov',y)));\n    const L1=this.buildLine(provVals,760,230);\n    out.trendPoints=L1.poly; out.trendArea=L1.area;\n    out.trendGrid=[0,1,2,3].map(i=>({y:L1.top+(L1.bot-L1.top)*i/3}));\n    out.trendDots=L1.pts.map((p,i)=>({x:p.x,y:p.y,ty:p.y-12,val:this.fmtShort(p.v),year:yrs[i]}));\n\n    // ===== DETAIL =====\n    const det=this.regionById(S.region), df=this.fin(S.region,year);\n    out.detRegion=S.region; out.detRegionName=det.name;\n    out.regionOpts=regions.map(r=>({v:r.id,label:r.name}));\n    out.onDetRegion=(e)=>set({region:e.target.value});\n    out.detKpis=[\n      {label:'Pendapatan',value:this.fmt(df.realizedRev),bar:'var(--green,#1B6744)',sub:'Realisasi '+this.fmtPct(df.serapan*100)},\n      {label:'Belanja',value:this.fmt(df.realizedExp),bar:'var(--green2,#289865)',sub:'Serapan '+this.fmtPct(df.expSer*100)},\n      {label:'PAD',value:this.fmt(df.padRealized),bar:'var(--gold,#D4AF37)',sub:'Efektivitas '+this.fmtPct(df.padEff*100)},\n      {label:'Belanja Modal',value:this.fmt(df.realizedExp*df.bd.modal),bar:'var(--gold-dark,#7A631A)',sub:this.fmtPct(df.bd.modal*100)+' dari belanja'},\n    ];\n    // donut\n    const segs=[\n      {label:'Belanja Pegawai',v:df.bd.pegawai,color:'#1B6744'},\n      {label:'Barang & Jasa',v:df.bd.barang,color:'#289865'},\n      {label:'Belanja Modal',v:df.bd.modal,color:'#D4AF37'},\n      {label:'Lainnya',v:df.bd.lain,color:'#E9D69B'},\n    ];\n    let acc=0; const stops=segs.map(s=>{const a=acc*360,b=(acc+s.v)*360;acc+=s.v;return s.color+' '+a.toFixed(1)+'deg '+b.toFixed(1)+'deg';});\n    out.donutBg='conic-gradient('+stops.join(',')+')';\n    out.detTotalExp=this.fmtShort(df.realizedExp);\n    out.donutLegend=segs.map(s=>({label:s.label,color:s.color,pct:this.fmtPct(s.v*100),val:this.fmt(df.realizedExp*s.v)}));\n    // detail trend\n    const detVals=yrs.map(y=>this.fin(S.region,y).realizedRev);\n    const L2=this.buildLine(detVals,700,200);\n    out.detTrendPoints=L2.poly; out.detTrendArea=L2.area;\n    out.detTrendDots=L2.pts.map((p,i)=>({x:p.x,y:p.y,ty:p.y-11,val:this.fmtShort(p.v),year:yrs[i]}));\n    // detail rows\n    const mkRow=(label,planned,realized,head)=>{const pct=planned?realized/planned*100:0;return {label,planned:this.fmt(planned),realized:this.fmt(realized),pct:this.fmtPct(pct),pctColor:pct>=90?'var(--green2,#289865)':pct>=75?'var(--gold-dark,#7A631A)':'#C24B33',fw:head?'800':'500',rowStyle:head?'background:var(--surface2,#EAF1EA)':''};};\n    out.detRows=[\n      mkRow('PENDAPATAN',df.plannedRev,df.realizedRev,true),\n      mkRow('  PAD',df.padPlanned,df.padRealized),\n      mkRow('  Dana Transfer',df.transfer,df.transferReal),\n      mkRow('BELANJA',df.plannedExp,df.realizedExp,true),\n      mkRow('  Belanja Pegawai',df.plannedExp*df.bd.pegawai,df.realizedExp*df.bd.pegawai),\n      mkRow('  Barang & Jasa',df.plannedExp*df.bd.barang,df.realizedExp*df.bd.barang),\n      mkRow('  Belanja Modal',df.plannedExp*df.bd.modal,df.realizedExp*df.bd.modal),\n    ];\n    out.goRekFromDetail=()=>set({view:'rekomendasi',rekRegion:S.region});\n\n    // ===== RASIO =====\n    const cfg=this.ratioCfg(); const cmp=S.compare;\n    out.regionChips=kab.map(r=>{const on=cmp.includes(r.id);\n      const style='height:32px;padding:0 13px;border-radius:9px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s;border:1px solid '+(on?'var(--green,#1B6744)':'var(--border,#dce6dd)')+';background:'+(on?'var(--green,#1B6744)':'var(--surface,#fff)')+';color:'+(on?'#fff':'var(--muted,#62736A)');\n      return {name:r.short,style,onClick:()=>{ let nc; if(on) nc=cmp.filter(x=>x!==r.id); else if(cmp.length>=4) nc=cmp; else nc=[...cmp,r.id]; if(nc.length===0) nc=[r.id]; set({compare:nc}); }};\n    });\n    const palette=['#1B6744','#D4AF37','#289865','#7A631A'];\n    const cmpReg=cmp.map((id,i)=>({id,name:this.regionById(id).name,color:palette[i%palette.length]}));\n    out.ratioCols=cmpReg.map(c=>({name:c.name,color:c.color}));\n    const keys=['ddf','rkk','efektivitas','efisiensi','bmodal','ketergantungan'];\n    out.ratioRows=keys.map(k=>({label:cfg[k].label,desc:cfg[k].desc,cells:cmp.map(id=>{const v=this.ratios(id,year)[k];const st=this.statusFor(k,v);return {val:this.fmtPct(v),label:st.label,pill:this.tonePill(st.tone)};})}));\n    // radar\n    const cx=160,cy=148,R=92,AX=[{k:'ddf',l:'DDF'},{k:'rkk',l:'Mandiri'},{k:'efektivitas',l:'Efektif'},{k:'efisiensi',l:'Efisien'},{k:'bmodal',l:'B.Modal'},{k:'ketergantungan',l:'Tergantung'}];\n    const RMAX={ddf:55,rkk:130,efektivitas:115,efisiensi:120,bmodal:42,ketergantungan:100};\n    const ang=i=>(-90+i*60)*Math.PI/180;\n    out.radarAxes=AX.map((a,i)=>{const c=Math.cos(ang(i)),s=Math.sin(ang(i));const lr=R+16;return {x:(cx+R*c).toFixed(1),y:(cy+R*s).toFixed(1),lx:(cx+lr*c).toFixed(1),ly:(cy+lr*s+3).toFixed(1),label:a.l,anchor:Math.abs(c)<0.3?'middle':c>0?'start':'end'};});\n    out.radarRings=[0.34,0.67,1].map(f=>({points:AX.map((a,i)=>(cx+R*f*Math.cos(ang(i))).toFixed(1)+','+(cy+R*f*Math.sin(ang(i))).toFixed(1)).join(' ')}));\n    out.radarShapes=cmpReg.map(c=>{const rt=this.ratios(c.id,year);const pts=AX.map((a,i)=>{const n=Math.max(0.05,Math.min(1,rt[a.k]/RMAX[a.k]));return (cx+R*n*Math.cos(ang(i))).toFixed(1)+','+(cy+R*n*Math.sin(ang(i))).toFixed(1);}).join(' ');return {points:pts,fill:c.color+'2e',stroke:c.color};});\n    out.radarLegend=cmpReg.map(c=>({name:c.name,color:c.color}));\n\n    // ===== REKOMENDASI =====\n    let pool=[];\n    if(S.rekRegion==='semua') kab.forEach(r=>pool.push(...this.recsFor(r.id,year)));\n    else pool.push(...this.recsFor(S.rekRegion,year));\n    const pw={Tinggi:0,Sedang:1,Rendah:2};\n    const filt=pool.filter(r=>S.rekPri==='semua'||r.priority===S.rekPri).sort((a,b)=>pw[a.priority]-pw[b.priority]);\n    const priColor=(p)=>p==='Tinggi'?'#C24B33':p==='Sedang'?'var(--gold-dark,#7A631A)':'var(--green2,#289865)';\n    const priPill=(p)=>p==='Tinggi'?'background:rgba(194,75,51,.15);color:#C24B33':p==='Sedang'?'background:rgba(212,175,55,.18);color:var(--gold-dark,#7A631A)':'background:rgba(40,152,101,.15);color:var(--green2,#289865)';\n    out.recCards=filt.map(r=>({region:r.region,priority:r.priority,accent:priColor(r.priority),pill:priPill(r.priority),title:r.title,reason:r.reason,refLabel:r.refLabel,onClick:()=>{ if(r.ref==='rasio') set({view:'rasio',compare:[r.rid]}); else if(r.ref==='detail'||r.ref==='serapan') set({view:'detail',region:r.rid}); }}));\n    out.recEmpty=filt.length===0;\n    const pris=[{id:'semua',label:'Semua'},{id:'Tinggi',label:'Tinggi'},{id:'Sedang',label:'Sedang'},{id:'Rendah',label:'Rendah'}];\n    out.priTabs=pris.map(p=>({label:p.label,style:this.pillTab(S.rekPri===p.id),onClick:()=>set({rekPri:p.id})}));\n    out.rekRegion=S.rekRegion;\n    out.rekRegionOpts=[{v:'semua',label:'Semua Daerah'},...kab.map(r=>({v:r.id,label:r.name}))];\n    out.onRekRegion=(e)=>set({rekRegion:e.target.value});\n    const cnt=(p)=>pool.filter(r=>r.priority===p).length;\n    out.priCounts=[{label:'Tinggi',n:cnt('Tinggi'),bg:'rgba(194,75,51,.12)',fg:'#C24B33'},{label:'Sedang',n:cnt('Sedang'),bg:'rgba(212,175,55,.14)',fg:'var(--gold-dark,#7A631A)'},{label:'Rendah',n:cnt('Rendah'),bg:'rgba(40,152,101,.12)',fg:'var(--green2,#289865)'}];\n\n    // ===== ADMIN =====\n    out.adminLocked=!S.authed; out.adminUnlocked=S.authed;\n    out.onLogin=()=>set({authed:true}); out.onLogout=()=>set({authed:false,importDone:false,importing:false});\n    out.uploadName=S.uploadName;\n    out.onPickFile=()=>set({uploadName:'APBD_'+(S.year)+'_Mataram_audited.xlsx'});\n    out.importing=S.importing; out.importDone=S.importDone; out.newRecCount=3;\n    out.importLabel=S.importing?'Memproses…':'Impor & Analisis AI';\n    out.importBtnStyle='width:100%;height:46px;margin-top:14px;border-radius:11px;border:0;background:'+(S.importing?'var(--muted,#62736A)':'linear-gradient(135deg,var(--green,#1B6744),var(--green2,#289865))')+';color:#fff;font-weight:700;font-size:13.5px;cursor:'+(S.importing?'wait':'pointer')+';font-family:inherit';\n    out.onImport=()=>this.runImport();\n    const steps=[\n      {label:'Mengunggah ke InsForge Storage',done:true},\n      {label:'Parsing & validasi data (SheetJS)',done:true},\n      {label:'Memperbarui ringkasan & rasio',done:S.importDone},\n      {label:'Analisis anomali via OpenRouter API',done:S.importDone},\n    ];\n    out.importSteps=steps.map(s=>({label:s.label,icon:s.done?'✓':'•',color:s.done?'var(--text,#16271E)':'var(--muted,#62736A)',dot:s.done?'background:var(--green2,#289865);color:#fff':'background:var(--surface2,#EAF1EA);color:var(--muted,#62736A)'}));\n    const okPill='background:rgba(40,152,101,.15);color:var(--green2,#289865)';\n    out.uploadHistory=[\n      {region:'Kota Mataram',year:2024,status:'Sukses',statusPill:okPill,time:'2 jam lalu'},\n      {region:'Kab. Lombok Timur',year:2024,status:'Sukses',statusPill:okPill,time:'kemarin'},\n      {region:'Provinsi NTB',year:2024,status:'Sukses',statusPill:okPill,time:'3 hari lalu'},\n      {region:'Kab. Bima',year:2023,status:'Sukses',statusPill:okPill,time:'1 mgg lalu'},\n      {region:'Kota Bima',year:2023,status:'Sukses',statusPill:okPill,time:'2 mgg lalu'},\n    ];\n\n    return out;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
